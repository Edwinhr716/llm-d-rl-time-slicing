name: Docker Build and Push
description: Build and push multi-arch container image to ghcr.io

inputs:
  image-name:
    required: true
    description: Image name (e.g., my-project)
  tag:
    required: true
    description: Image tag (e.g., v0.1.0)
  extra-tags:
    required: false
    description: More tags for the same image, space-separated (e.g., "demo-abc1234 demo")
    default: ""
  github-token:
    required: true
    description: GitHub token for ghcr.io login
  registry:
    required: false
    description: Container registry (lowercased before use; image references must be lowercase)
    default: ghcr.io/llm-d
  dockerfile:
    required: false
    description: Path to the Dockerfile to build
    default: Dockerfile
  platforms:
    required: false
    description: Target platforms
    default: linux/amd64,linux/arm64
  prerelease:
    required: false
    description: If true, skip tagging as 'latest'
    default: "false"

outputs:
  image:
    description: The pushed image reference (registry/image-name:tag)
    value: ${{ steps.build.outputs.image }}
  digest:
    description: The pushed image digest (sha256:...)
    value: ${{ steps.build.outputs.digest }}

runs:
  using: "composite"
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ACTOR: ${{ github.actor }}
      run: echo "${GH_TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin
      shell: bash

    - name: Build and push image
      id: build
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        TAG: ${{ inputs.tag }}
        EXTRA_TAGS: ${{ inputs.extra-tags }}
        REGISTRY: ${{ inputs.registry }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        PLATFORMS: ${{ inputs.platforms }}
        PRERELEASE: ${{ inputs.prerelease }}
        SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
      run: |
        set -euo pipefail
        IMAGE="${REGISTRY,,}/${IMAGE_NAME}"
        TAGS=(-t "${IMAGE}:${TAG}")
        for t in ${EXTRA_TAGS}; do
          TAGS+=(-t "${IMAGE}:${t}")
        done
        if [[ "${PRERELEASE}" != "true" ]]; then
          TAGS+=(-t "${IMAGE}:latest")
        fi
        docker buildx build \
          -f "${DOCKERFILE}" \
          --platform "${PLATFORMS}" \
          --push \
          --metadata-file /tmp/build-metadata.json \
          --annotation "index:org.opencontainers.image.source=${SOURCE_URL}" \
          --annotation "index:org.opencontainers.image.licenses=Apache-2.0" \
          --label "org.opencontainers.image.source=${SOURCE_URL}" \
          --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
          "${TAGS[@]}" .
        DIGEST="$(jq -r '."containerimage.digest" // empty' /tmp/build-metadata.json)"
        echo "image=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"
        echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
        echo "Pushed ${IMAGE}:${TAG}${EXTRA_TAGS:+ (also: ${EXTRA_TAGS})} ${DIGEST}"
      shell: bash
