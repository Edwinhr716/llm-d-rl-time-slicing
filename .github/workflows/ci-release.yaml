name: CI - Release

# Publishes every image the Helm chart and the quickstart use to
# ghcr.io/<owner>/<repo>/<component> (owner and repo lowercased):
#   - push to main:                    'latest'
#   - manual run with a version:       that version only
#   - push to a release branch (the patterns below) or a manual run on any
#     other branch without a version:  an immutable '<prefix>-<short sha>'
#     (prefix 'demo' unless set) plus a moving tag named after the branch
#     ('/' becomes '-'), e.g. demo-1a2b3c4 and demo-mybranch.
# The verl job (verl with the timeslice integration built in, ~24 GB) runs on
# its own runner and can be skipped; a failure there does not stop the others.
on:
  push:
    branches:
      - main
      # Release branches: every push publishes '<prefix>-<short sha>' plus the
      # branch tag. Edit these patterns to release from other branches.
      - demo
      - "demo-*"
      - "demo/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. v0.1.0). Leave empty for 'latest' on main, or '<prefix>-<short sha>' plus a branch tag on any other branch."
        required: false
        default: ""
      tag-prefix:
        description: "Prefix of the immutable tag on a non-main branch ('<prefix>-<short sha>')."
        required: false
        default: "demo"
      verl:
        description: "Also build and push the verl image (about 24 GB; takes 30 to 60 minutes)."
        type: boolean
        required: false
        default: true
      verl-runner:
        description: "Runner label for the verl job (empty: the VERL_RUNNER repository variable, else ubuntu-latest). Use a larger runner if the standard one runs out of disk."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

# One release per ref at a time, so the moving branch tag ends on the newest commit.
concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tags:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.tag.outputs.registry }}
      tag: ${{ steps.tag.outputs.tag }}
      extra-tags: ${{ steps.tag.outputs.extra_tags }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Determine registry and tags
        id: tag
        env:
          # Read via env, not template interpolation, so the inputs can't be
          # rendered into Bash source; validated as Docker tags below.
          VERSION: ${{ github.event.inputs.version }}
          TAG_PREFIX: ${{ github.event.inputs.tag-prefix }}
        run: |
          set -euo pipefail
          valid_tag='^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
          if [[ -n "${VERSION}" && ! "${VERSION}" =~ ${valid_tag} ]]; then
            echo "Invalid image tag: ${VERSION}" >&2
            exit 1
          fi
          # Image references must be lowercase; the owner may not be.
          echo "registry=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          extra=""
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${VERSION}" ]]; then
            # Manual versioned release: publish only the requested tag,
            # leave 'latest' to main-branch builds.
            tag="${VERSION}"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            # Every main merge (and tag-less manual runs on main) publishes 'latest'.
            tag="latest"
          elif [[ "${GITHUB_REF}" == refs/heads/* ]]; then
            # Release branch: immutable '<prefix>-<short sha>' plus a moving
            # tag named after the branch.
            prefix="${TAG_PREFIX:-demo}"
            if [[ ! "${prefix}" =~ ^[a-z0-9][a-z0-9_.-]{0,39}$ ]]; then
              echo "Invalid tag prefix: ${prefix}" >&2
              exit 1
            fi
            tag="${prefix}-${GITHUB_SHA::7}"
            branch="${GITHUB_REF_NAME,,}"
            branch="$(printf '%s' "${branch}" | tr -c 'a-z0-9_.-' '-' | sed -E 's/^[.-]+//' | cut -c1-128)"
            if [[ -n "${branch}" && "${branch}" != "latest" && "${branch}" =~ ${valid_tag} ]]; then
              extra="${branch}"
            fi
          else
            echo "Refusing to release from ${GITHUB_REF} without a version" >&2
            exit 1
          fi
          {
            echo "tag=${tag}"
            echo "extra_tags=${extra}"
            # 'latest' is only ever the tag itself (main), never added on top.
            echo "prerelease=true"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing tag ${tag}${extra:+ and ${extra}} to ghcr.io/${GITHUB_REPOSITORY,,}"
        shell: bash

  docker-build-and-push:
    needs: tags
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Single-platform (amd64) for every component: the platform is adopted
          # as a unit, and the snapshot-agent is x86_64-only today (cuda-checkpoint
          # binary + CGO build). Revisit together when an aarch64
          # cuda-checkpoint is available. Every build context is the repository root.
          - component: timesliceorchestrator
            dockerfile: docker/timesliceorchestrator/Dockerfile
            platforms: linux/amd64
          - component: snapshot-agent
            dockerfile: docker/snapshot-agent/Dockerfile
            platforms: linux/amd64
          - component: guest-kubelet
            dockerfile: guest-kubelet/Dockerfile
            platforms: linux/amd64
          - component: gpu-shadow-plugin
            dockerfile: guest-kubelet/Dockerfile.gpu-shadow
            platforms: linux/amd64
          - component: timeslice-webhook
            dockerfile: docker/timeslice-webhook/Dockerfile
            platforms: linux/amd64
          - component: donor-controller
            dockerfile: deploy/donor-controller/Dockerfile
            platforms: linux/amd64
          - component: rl-integration
            dockerfile: docker/rl-integration/Dockerfile
            platforms: linux/amd64
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build and push
        id: build
        uses: ./.github/actions/docker-build-and-push
        with:
          image-name: ${{ matrix.component }}
          dockerfile: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          registry: ${{ needs.tags.outputs.registry }}
          tag: ${{ needs.tags.outputs.tag }}
          extra-tags: ${{ needs.tags.outputs.extra-tags }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ needs.tags.outputs.prerelease }}

      - name: Summary
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          EXTRA: ${{ needs.tags.outputs.extra-tags }}
        run: |
          echo "- \`${IMAGE}\`${EXTRA:+ (also tagged ${EXTRA})}: \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Trivy security scan
        uses: ./.github/actions/trivy-scan
        with:
          image: ${{ steps.build.outputs.image }}

  # verl with the timeslice integration built in (docker/verl/Dockerfile). The
  # base image is ~11 GB compressed and ~24 GB unpacked; BuildKit keeps both,
  # which does not fit a standard runner's free disk. The job removes the
  # runner's preinstalled toolchains and moves Docker's storage to the larger
  # disk first. If that is still not enough, run it on a larger runner
  # (workflow input verl-runner or the VERL_RUNNER repository variable).
  # No Trivy scan here: it would pull the 11 GB image a second time.
  verl:
    needs: tags
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.verl }}
    runs-on: ${{ inputs.verl-runner || vars.VERL_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          set -uo pipefail
          df -h / /mnt 2>/dev/null || df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/node /usr/local/share/boost \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules /opt/microsoft /opt/google /opt/az /opt/pipx \
            /usr/lib/jvm /usr/share/miniconda "${AGENT_TOOLSDIRECTORY:-/nonexistent}" || true
          docker system prune --all --force --volumes || true
          { sudo swapoff -a; sudo rm -f /mnt/swapfile /swapfile; } || true
          df -h / /mnt 2>/dev/null || df -h /
        shell: bash

      - name: Put Docker storage on the disk with the most free space
        run: |
          set -euo pipefail
          root_free=$(df --output=avail -B1G / | tail -1 | tr -d ' ')
          mnt_free=0
          if mountpoint -q /mnt; then mnt_free=$(df --output=avail -B1G /mnt | tail -1 | tr -d ' '); fi
          echo "free: / ${root_free} GB, /mnt ${mnt_free} GB"
          free="${root_free}"
          if (( mnt_free > root_free )); then
            sudo systemctl stop docker docker.socket
            sudo mkdir -p /mnt/docker
            cfg=/etc/docker/daemon.json
            if [[ -s "${cfg}" ]]; then jq '. + {"data-root": "/mnt/docker"}' "${cfg}" > /tmp/daemon.json; else echo '{"data-root": "/mnt/docker"}' > /tmp/daemon.json; fi
            sudo mv /tmp/daemon.json "${cfg}"
            sudo systemctl start docker
            free="${mnt_free}"
          fi
          docker info --format 'Docker root: {{.DockerRootDir}}'
          # Compressed plus unpacked base image, plus headroom.
          if (( free < 40 )); then
            echo "::error::Only ${free} GB free for Docker; the verl build needs about 40 GB. Run the verl job on a larger runner (input verl-runner or variable VERL_RUNNER)."
            exit 1
          fi
        shell: bash

      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build and push
        id: build
        uses: ./.github/actions/docker-build-and-push
        with:
          image-name: verl
          dockerfile: docker/verl/Dockerfile
          platforms: linux/amd64
          registry: ${{ needs.tags.outputs.registry }}
          tag: ${{ needs.tags.outputs.tag }}
          extra-tags: ${{ needs.tags.outputs.extra-tags }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ needs.tags.outputs.prerelease }}

      - name: Summary
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          EXTRA: ${{ needs.tags.outputs.extra-tags }}
        run: |
          echo "- \`${IMAGE}\`${EXTRA:+ (also tagged ${EXTRA})}: \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          df -h / /mnt 2>/dev/null || df -h /
        shell: bash

  # Lists what this run published: per image, every tag, the digest and the
  # compressed size of the linux/amd64 image. Read-only (registry reads).
  verify:
    needs: [tags, docker-build-and-push, verl]
    if: ${{ always() && needs.tags.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Inspect published images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REGISTRY: ${{ needs.tags.outputs.registry }}
          TAG: ${{ needs.tags.outputs.tag }}
          EXTRA: ${{ needs.tags.outputs.extra-tags }}
          VERL_RESULT: ${{ needs.verl.result }}
        run: |
          set -uo pipefail
          components="timesliceorchestrator snapshot-agent guest-kubelet gpu-shadow-plugin timeslice-webhook donor-controller rl-integration"
          if [[ "${VERL_RESULT}" != "skipped" ]]; then components="${components} verl"; fi
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin
          {
            echo "### Published images"
            echo "| image | tags | digest | amd64 compressed |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          missing=0
          for c in ${components}; do
            ref="${REGISTRY}/${c}:${TAG}"
            if ! raw="$(docker buildx imagetools inspect --raw "${ref}" 2>/dev/null)"; then
              echo "MISSING ${ref}"; echo "| ${c} | missing | | |" >> "$GITHUB_STEP_SUMMARY"
              missing=1; continue
            fi
            digest="$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest}}' | jq -r .digest)"
            tags="${TAG}"
            for t in ${EXTRA}; do
              d="$(docker buildx imagetools inspect "${REGISTRY}/${c}:${t}" --format '{{json .Manifest}}' 2>/dev/null | jq -r .digest)"
              if [[ "${d}" == "${digest}" ]]; then tags="${tags} ${t}"; else tags="${tags} ${t}(differs)"; fi
            done
            amd64="$(printf '%s' "${raw}" | jq -r '.manifests[]? | select(.platform.architecture=="amd64" and .platform.os=="linux") | .digest' | head -1)"
            if [[ -n "${amd64}" ]]; then
              size="$(docker buildx imagetools inspect --raw "${REGISTRY}/${c}@${amd64}" | jq '[.layers[].size] | add')"
            else
              size="$(printf '%s' "${raw}" | jq '[.layers[]?.size] | add')"
            fi
            mb=$(( size / 1000000 ))
            echo "OK ${REGISTRY}/${c} tags=[${tags}] digest=${digest} amd64=${amd64:-n/a} compressed=${mb}MB"
            echo "| ${c} | ${tags} | \`${digest}\` | ${mb} MB |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "${missing}"
        shell: bash
