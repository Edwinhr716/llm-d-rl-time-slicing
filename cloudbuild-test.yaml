# Runs the repo's build + test suites in Cloud Build:
#   - go build + go vet + go test -race (whole module)
#   - cross-language integration test (Go agent <-> Python client)
#   - Python client unit tests (pytest)
#   - helm template sanity for the memoryRegions values block
#
# Usage: gcloud builds submit . --config=cloudbuild-test.yaml
steps:
  - id: go-build-test
    name: golang:1.26-bookworm
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        go build ./...
        go vet ./...
        go test -race -count=1 ./...
  - id: cross-language-test
    name: golang:1.26-bookworm
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq python3 python3-pip python3-venv >/dev/null
        python3 -m venv /tmp/venv
        /tmp/venv/bin/pip -q install grpcio protobuf
        CROSS_LANG_TEST=1 CROSS_LANG_PYTHON=/tmp/venv/bin/python \
          go test -v -count=1 ./tests/integration/memory-regions/
  - id: python-tests
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip -q install grpcio protobuf pytest
        cd pkg/client/python
        python -m pytest tests/ -q
  - id: helm-template
    name: alpine/helm:3.16.2
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        helm template snapshot-agent deploy/snapshot-agent >/tmp/plain.yaml
        grep -q "DEPLOYMENT_MODE" /tmp/plain.yaml
        ! grep -q "EXPORT_FILE_PATH" /tmp/plain.yaml
        ! grep -q "hostIPC" /tmp/plain.yaml
        helm template snapshot-agent deploy/snapshot-agent --set memoryRegions.enabled=true >/tmp/mr.yaml
        grep -q "EXPORT_FILE_PATH" /tmp/mr.yaml
        grep -q "hostIPC: true" /tmp/mr.yaml
        grep -q "mount-hugetlbfs" /tmp/mr.yaml
        grep -q "hugepages-2Mi" /tmp/mr.yaml
        grep -q "mountPropagation: HostToContainer" /tmp/mr.yaml
        # snapshot store must default to tmpfs, not boot disk (swap-latency
        # regression guard), with an OOM-safe agent memory fallback
        grep -q "/dev/shm/gcr-snapshots" /tmp/mr.yaml
        ! grep -q "memory: 512Mi" /tmp/mr.yaml
        echo "helm template checks passed"
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
