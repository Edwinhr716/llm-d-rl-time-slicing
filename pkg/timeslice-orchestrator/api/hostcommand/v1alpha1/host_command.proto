syntax = "proto3";

package timeslice_hostcommand.v1alpha1;

option go_package = "github.com/llm-d-incubation/llm-d-rl-time-slicing/pkg/timeslice-orchestrator/api/hostcommand/v1alpha1;v1alpha1";

import "google/protobuf/timestamp.proto";

// HostCommandService is served by the per-host component of a shared host
// (the virtual kubelet) at <node InternalIP>:<host command port>. The
// orchestrator is its only caller.
//
// The background lock protocol on the orchestrator service is unchanged: the
// host still calls Acquire and Yield with ROLE_BACKGROUND and heartbeats with
// GetGroupStatus(participant_id). This service adds the push half:
//
//   - On a foreground Acquire that starts a notice, the orchestrator sends
//     Vacate to every host that holds a grant or a claim. It grants the
//     foreground only after every one of those hosts has acked
//     OUTCOME_VACATED for the notice's epoch.
//   - When the orchestrator lends the accelerator (a foreground Yield with a
//     long enough expected_idle), it grants the hosts and sends Resume to each.
//     A host starts guests only on Resume, never on its Acquire returning.
//
// Epochs. Every command carries an epoch that increases strictly across
// commands, also across orchestrator restarts (the orchestrator derives it
// from the wall clock). A host keeps the highest epoch it has seen. A command
// with a lower epoch is answered OUTCOME_STALE_EPOCH and does nothing. A
// command with a higher epoch runs after the host's current command; a Vacate
// that arrives while a Vacate runs joins it and is acked when it finishes.
//
// Both RPCs return only when the command is done: the response is the ack.
// Both are idempotent: a Vacate on a host whose guests are already suspended
// acks OUTCOME_VACATED at once.
service HostCommandService {
  // Vacate stops every guest on the host: for each guest, mark it not ready
  // and wait until that is confirmed, then suspend it, all before deadline.
  // It acks OUTCOME_VACATED only when every guest is suspended.
  rpc Vacate(VacateRequest) returns (HostAck);

  // Resume starts the host's guests again: for each guest, resume it and then
  // mark it ready.
  rpc Resume(ResumeRequest) returns (HostAck);
}

// Command names the command an ack answers.
enum Command {
  COMMAND_UNSPECIFIED = 0;
  COMMAND_VACATE = 1;
  COMMAND_RESUME = 2;
}

// Outcome is the result of a command, for the host or for one guest.
enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  // Every guest is suspended: the host is clear.
  OUTCOME_VACATED = 1;
  // Every guest was resumed and marked ready.
  OUTCOME_RESUMED = 2;
  // The command failed; error says why. After a failed Vacate the host is not
  // clear.
  OUTCOME_FAILED = 3;
  // The epoch is lower than one the host has seen. Nothing was done.
  // HostAck.current_epoch holds the higher epoch.
  OUTCOME_STALE_EPOCH = 4;
}

message VacateRequest {
  string group_id = 1;
  // The real node the command is for. A host refuses a command for another
  // node.
  string node_name = 2;
  int64 epoch = 3;
  // Absolute time by which every guest must be suspended: T = notice + N - K.
  google.protobuf.Timestamp deadline = 4;
}

message ResumeRequest {
  string group_id = 1;
  string node_name = 2;
  int64 epoch = 3;
  // Absolute time by which every guest should be resumed.
  google.protobuf.Timestamp deadline = 4;
}

// GuestResult is the outcome of a command for one guest.
message GuestResult {
  string guest = 1;
  Outcome outcome = 2;
  string error = 3;
}

// HostAck answers a command. The orchestrator acts on an ack only when its
// command and epoch match the command it is waiting for.
message HostAck {
  string node_name = 1;
  // The epoch of the command this ack answers.
  int64 epoch = 2;
  Command command = 3;
  Outcome outcome = 4;
  // The highest epoch the host has seen.
  int64 current_epoch = 5;
  repeated GuestResult guests = 6;
  string error = 7;
}
