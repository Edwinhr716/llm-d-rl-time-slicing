# RL donor as a KubeRay RayJob (RL_DONOR=rayjob). Same rl-trainer image, model
# and pacing as the bare-Pod form (rl-pod.yaml); only the Ray bootstrap
# differs: KubeRay starts Ray, each worker preps itself (verl + timeslice
# plugin install, dataset) before its raylet starts, and the job entrypoint
# runs the fully_async_main command that run_head.sh runs in the Pod form.
#
# Diff against rl-rayjob-stock.yaml (the same job without time-slicing):
#   - trainers group: timeslice.io/donor label, the Ray resource pin
#     trainer_node, plus hand-added job-id and group labels (stand-ins for
#     the webhook), the shared DRA claim, the group-host nodeSelector and the
#     timeslice.io/shared toleration.
#   - samplers group: the Ray resource pin rollout_node and anti-affinity to
#     the group hosts. No timeslice labels: never snapshotted.
#   - entrypoint: async_training.trainer_name=timeslice and
#     ray_pg_extra_resources.
#   - runtimeEnvYAML: the TIMESLICE_* plugin settings.
#
# job-id: fixed to the RayJob name (__JOB__). KubeRay suffixes the RayCluster
# name, so a hand-written label cannot equal ray.io/cluster.
#
# Placeholders: __NS__ __REGISTRY__ __GROUP__ __JOB__ __TRAINER_REPLICAS__.
# Render with render.sh (RL_DONOR=rayjob). Needs KubeRay (see kuberay/).
# The trainers reference the ResourceClaim from rl-claim.yaml.
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: __JOB__
  namespace: __NS__
spec:
  jobId: __JOB__
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 600
  # The head has num-cpus 0, so the driver runs on a prepped worker.
  entrypointNumCpus: 1
  # One line after folding. Values that need quoting are quoted for two shell
  # parses (the submitter's bash, then the job supervisor's sh).
  entrypoint: >-
    timeout --signal=INT --kill-after=120 10800
    python3 -m verl.experimental.fully_async_policy.fully_async_main
    data.train_files=/workspace/data/eurus_code/train.parquet
    data.val_files=/workspace/data/eurus_code/val.parquet
    data.prompt_key=prompt
    data.truncation=left
    data.max_prompt_length=2048
    data.max_response_length=6144
    data.train_batch_size=0
    data.gen_batch_size=1
    data.return_raw_chat=True
    actor_rollout_ref.model.path=Qwen/Qwen2.5-0.5B-Instruct
    actor_rollout_ref.model.use_remove_padding=True
    actor_rollout_ref.model.enable_gradient_checkpointing=True
    actor_rollout_ref.hybrid_engine=False
    actor_rollout_ref.actor.strategy=fsdp
    actor_rollout_ref.actor.ppo_mini_batch_size=4
    actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1
    actor_rollout_ref.actor.use_kl_loss=False
    actor_rollout_ref.actor.kl_loss_coef=0.0
    actor_rollout_ref.actor.entropy_coeff=0
    actor_rollout_ref.actor.grad_clip=1.0
    actor_rollout_ref.actor.loss_agg_mode=token-mean
    actor_rollout_ref.actor.use_dynamic_bsz=True
    actor_rollout_ref.actor.ppo_max_token_len_per_gpu=8192
    actor_rollout_ref.actor.optim.lr=1e-6
    actor_rollout_ref.actor.optim.lr_warmup_steps=-1
    actor_rollout_ref.actor.fsdp_config.param_offload=True
    actor_rollout_ref.actor.fsdp_config.optimizer_offload=True
    actor_rollout_ref.ref.log_prob_use_dynamic_bsz=True
    actor_rollout_ref.ref.log_prob_max_token_len_per_gpu=8192
    actor_rollout_ref.rollout.name=vllm
    actor_rollout_ref.rollout.mode=async
    actor_rollout_ref.rollout.n=4
    actor_rollout_ref.rollout.calculate_log_probs=True
    actor_rollout_ref.rollout.checkpoint_engine.backend=nccl
    +actor_rollout_ref.rollout.checkpoint_engine.engine_kwargs.nccl.rebuild_group=True
    actor_rollout_ref.rollout.gpu_memory_utilization=0.55
    actor_rollout_ref.rollout.tensor_model_parallel_size=1
    actor_rollout_ref.rollout.max_model_len=8192
    actor_rollout_ref.rollout.max_num_batched_tokens=8192
    actor_rollout_ref.rollout.enable_chunked_prefill=True
    actor_rollout_ref.rollout.temperature=1.0
    actor_rollout_ref.rollout.top_p=1.0
    actor_rollout_ref.rollout.top_k=-1
    algorithm.adv_estimator=grpo
    algorithm.use_kl_in_reward=False
    algorithm.kl_ctrl.kl_coef=0.0
    'trainer.logger=[console]'
    trainer.val_before_train=False
    trainer.save_freq=-1
    trainer.resume_mode=disable
    trainer.nnodes=1
    trainer.n_gpus_per_node=1
    trainer.total_epochs=10
    trainer.test_freq=-1
    trainer.project_name=timeslice-demo
    trainer.experiment_name=rl-batch-code-l4
    trainer.default_local_dir=/workspace/results/ckpts
    rollout.nnodes=1
    rollout.n_gpus_per_node=1
    rollout.total_rollout_steps=65536
    async_training.staleness_threshold=8
    async_training.trainer_name=timeslice
    async_training.trigger_parameter_sync_step=1
    async_training.use_dynamic_resource_scheduling=False
    async_training.use_trainer_do_validate=False
    "'ray_pg_extra_resources={trainer_pool:{trainer_node:1},rollout_pool:{rollout_node:1}}'"
  # Reaches every actor of the job, on any Ray node: the timeslice trainer
  # driver actor is CPU-only and can land on either worker.
  runtimeEnvYAML: |
    env_vars:
      TIMESLICE_FULLY_ASYNC: "1"
      TIMESLICE_JOB_ID: "__JOB__"
      TIMESLICE_GROUP: "__GROUP__"
      TIMESLICE_ORCH_ADDR: "timeslice-timesliceorchestrator.timeslice-system.svc:50051"
  rayClusterSpec:
    headGroupSpec:
      rayStartParams:
        num-cpus: "0"
        dashboard-host: "0.0.0.0"
      template:
        spec:
          containers:
            - name: ray-head
              image: __REGISTRY__/rl-trainer:v0.1.6
              resources:
                requests:
                  cpu: "2"
                  memory: "8Gi"
                limits:
                  memory: "8Gi"
    workerGroupSpecs:
      - groupName: trainers
        replicas: __TRAINER_REPLICAS__
        rayStartParams:
          num-gpus: "1"
          num-cpus: "24"
          resources: "'{\"trainer_node\": 100}'"
        template:
          metadata:
            labels:
              timeslice.io/donor: "true"
              timeslice.io/job-id: __JOB__
              timeslice.io/group: __GROUP__
          spec:
            nodeSelector:
              group.timeslice.io/__GROUP__: "true"
            tolerations:
              - key: nvidia.com/gpu
                operator: Exists
                effect: NoSchedule
              - key: timeslice.io/shared
                operator: Equal
                value: "true"
                effect: NoSchedule
            resourceClaims:
              - name: accelerator
                resourceClaimName: shared-trainers-gpu-claim
            containers:
              - name: ray-worker
                image: __REGISTRY__/rl-trainer:v0.1.6
                env:
                  - name: VLLM_USE_V1
                    value: "1"
                  - name: HF_HOME
                    value: "/workspace/hf"
                  - name: NCCL_CUMEM_ENABLE
                    value: "0"
                  - name: NCCL_NVLS_ENABLE
                    value: "0"
                  - name: PYTORCH_CUDA_ALLOC_CONF
                    value: "expandable_segments:True"
                  - name: VERL_REPO
                    value: "https://github.com/aishukamal/verl.git"
                  - name: VERL_REF
                    value: "feat/fully-async-lifecycle-hooks"
                # Per-node prep; KubeRay appends its Ray start after these args.
                args:
                  - >-
                    set -eo pipefail;
                    mkdir -p /workspace/results;
                    export RESULTS_DIR=/workspace/results;
                    source /opt/timeslice-demo/install_common.sh;
                    cd /workspace;
                    python3 /opt/timeslice-demo/data_prep.py --out_dir /workspace/data/eurus_code
                    --tokenizer Qwen/Qwen2.5-0.5B-Instruct --train_size 512 --val_size 64
                # The prep takes ~20 min; KubeRay's default liveness probe would
                # restart the pod before the raylet exists.
                livenessProbe:
                  exec:
                    command: ["true"]
                resources:
                  requests:
                    cpu: "8"
                    memory: "40Gi"
                  limits:
                    memory: "64Gi"
                  claims:
                    - name: accelerator
      - groupName: samplers
        replicas: 1
        rayStartParams:
          num-gpus: "1"
          num-cpus: "24"
          resources: "'{\"rollout_node\": 100}'"
        template:
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: group.timeslice.io/__GROUP__
                          operator: DoesNotExist
            tolerations:
              - key: nvidia.com/gpu
                operator: Exists
                effect: NoSchedule
            containers:
              - name: ray-worker
                image: __REGISTRY__/rl-trainer:v0.1.6
                env:
                  - name: VLLM_USE_V1
                    value: "1"
                  - name: HF_HOME
                    value: "/workspace/hf"
                  - name: NCCL_CUMEM_ENABLE
                    value: "0"
                  - name: NCCL_NVLS_ENABLE
                    value: "0"
                  - name: PYTORCH_CUDA_ALLOC_CONF
                    value: "expandable_segments:True"
                  - name: VERL_REPO
                    value: "https://github.com/aishukamal/verl.git"
                  - name: VERL_REF
                    value: "feat/fully-async-lifecycle-hooks"
                args:
                  - >-
                    set -eo pipefail;
                    mkdir -p /workspace/results;
                    export RESULTS_DIR=/workspace/results;
                    source /opt/timeslice-demo/install_common.sh;
                    cd /workspace;
                    python3 /opt/timeslice-demo/data_prep.py --out_dir /workspace/data/eurus_code
                    --tokenizer Qwen/Qwen2.5-0.5B-Instruct --train_size 512 --val_size 64
                livenessProbe:
                  exec:
                    command: ["true"]
                resources:
                  requests:
                    cpu: "12"
                    memory: "60Gi"
                  limits:
                    nvidia.com/gpu: "1"
