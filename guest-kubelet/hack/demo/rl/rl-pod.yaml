# yamllint disable rule:indentation
# RL trainer job (the TIME-SLICED PRIORITY tenant) — 2-node Ray cluster,
# logic baked into the image (images/rl-trainer/, no ConfigMap):
#   rl-head    on the SHARED L4 node (group.timeslice.io/trainers=true, also
#              hosts shadow-vllm): ray head + FSDP trainer, cuda-checkpointed
#              at each yield. GPU via the shared DRA ResourceClaim.
#   rl-rollout on any other GPU node (required anti-affinity): ray worker +
#              vLLM rollout engine, always on, ordinary nvidia.com/gpu — NO
#              timeslice.io labels, never snapshotted.
#
# L4 adaptations (Phase 0 guide, L4 section):
#   - OPTIMIZER_OFFLOAD=True: the 1.5B trainer's on-GPU Adam states (~24 GB)
#     must live in host RAM to fit an L4's 24 GB.
#   - Requests sized for g2-standard-24 (24 vCPU / 96 Gi): head 8 CPU/40 Gi
#     (+ shadow-vllm 6 CPU/24 Gi on the same node), rollout 12 CPU/60 Gi.
#   - Expect much slower steps than the H100 reference (~570 s/step there).
#
# REPLACE ${REGISTRY} via build.sh render (or sed) before applying.
apiVersion: v1
kind: Pod
metadata:
  name: rl-head
  namespace: __NS__
  labels:
    app: rl-head
    # Exact keys the platform selects on. ONLY the head pod carries them:
    # the trainer is the sole time-sliced (snapshotted) process in the job.
    timeslice.io/job-id: __JOB__
    timeslice.io/group: __GROUP__
spec:
  restartPolicy: Never
  nodeSelector:
    group.timeslice.io/__GROUP__: "true"
  tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  - key: timeslice.io/shared
    operator: Equal
    value: "true"
    effect: NoSchedule
  resourceClaims:
  - name: accelerator
    resourceClaimName: shared-trainers-gpu-claim   # SAME claim as shadow-vllm
  containers:
  - name: head
    image: __REGISTRY__/rl-trainer:v0.1.6
    env:
    - name: VLLM_USE_V1
      value: "1"
    - name: STALENESS_THRESHOLD
      value: "8"
    - name: RUN_SECONDS
      value: "10800"
    # --- pacing: sized so the FIRST training step is actually reachable ---
    # With the old hardcoded values (16384 / 8 / 64) the rollouter produced
    # ~0.46 samples/min on one L4, so required_samples=64 would only be met
    # ~139 min in — past any RUN_SECONDS we have ever used. No run of the old
    # manifest could reach step 1; the "trainer bursts" everyone measured were
    # FSDP init and the first parameter sync. ppo_mini_batch_size is what
    # sets required_samples, so it is the load-bearing one.
    # The 1.5B default CANNOT complete a first optimizer step on an L4: torch's
    # Adam builds ~14 GiB of fp32 state on the param device, and with bf16
    # params + grads + ~4.9 GiB of CUDA/NCCL context the peak is ~26 GiB on a
    # 22 GiB card. Neither OPTIMIZER_OFFLOAD (moves state only AFTER it exists)
    # nor PARAM_OFFLOAD (verl reloads params before update_actor) avoids that
    # peak. A 0.5B actor fits with room to spare and is the same model
    # shadow-vllm serves, so the node's HF cache is shared.
    # TRADE-OFF: this is NOT the R1-Distill CoT recipe any more. It is a
    # pacing/memory substitute chosen so that a REAL training step exists to
    # measure. Revert to DeepSeek-R1-Distill-Qwen-1.5B on a >=40 GB card.
    - name: MODEL_ID
      value: "Qwen/Qwen2.5-0.5B-Instruct"
    # PHASE 2: 8192 (was 2048). In phase 1 the trainer always had samples
    # ready, so it re-requested the lock the instant it released and the batch
    # tenant was starved to a ~1 s window per cycle. Making each generated
    # sample 4x longer shifts the bottleneck to the rollout node, so the
    # trainer actually waits between steps and the batch tenant gets a real
    # serving window. Also lengthens each step -> longer bursts.
    - name: MAX_RESPONSE_LEN
      value: "6144"
    - name: ROLLOUT_N
      value: "4"
    # PHASE 2b: 4 (required_samples=4 -> ONE prompt per training step).
    # Measured in 2a: generation wall-clock is dominated by sequence length
    # (6144 decode steps), not by how many prompts are in flight, so shrinking
    # the mini-batch shortens the *training* step without shortening
    # generation. That is the only lever that makes the trainer
    # generation-bound instead of lock-bound, which is what is required to get
    # the batch tenant a real serving window between bursts.
    - name: PPO_MINI_BATCH
      value: "4"
    - name: GEN_BATCH_SIZE
      value: "1"
    # must be >= max_prompt_length (2048) + MAX_RESPONSE_LEN (2048)
    # >= max_prompt_length 2048 + MAX_RESPONSE_LEN 8192
    - name: ROLLOUT_MAX_LEN
      value: "8192"
    # 32768 (the script default) OOMs on L4 at the FIRST training step, which
    # is why nobody had seen it: with use_dynamic_bsz=True this caps how many
    # tokens are PACKED into one actor forward, and Qwen2.5's lm_head then
    # materialises [tokens x 151936] logits. At ~25.6k packed tokens that is a
    # single 7.42 GiB allocation against 6.56 GiB free -> torch.OutOfMemoryError
    # in transformer_impl.forward_step. 4096 = exactly one full sequence
    # (2048 prompt + 2048 response), so logits stay ~1.2 GiB.
    # NOTE: a trainer crash here crash-releases the lock and FAULTS the whole
    # group — recovery needs README §10, not just a pod restart.
    # must be >= 2048 prompt + 6144 response or verl cannot pack a single
    # sequence into a micro-batch. 8192 tok x 151936 vocab in fp32 logits is
    # ~5 GiB transient, which fits on the 0.5B actor; 10240 was judged too
    # close to the lm_head OOM that killed the 1.5B actor.
    - name: PPO_MAX_TOKEN_LEN
      value: "8192"
    # Second first-step OOM, after PPO_MAX_TOKEN_LEN fixed the lm_head one:
    # torch's Adam lazily allocates exp_avg/exp_avg_sq on the PARAMETER's
    # device during the first optimizer.step(). For the 1.5B actor that is
    # ~14 GiB of fp32 state on top of bf16 params + grads = 21.88/22.03 GiB
    # in use, dying on a 180 MiB request in adam._init_group.
    # optimizer_offload=True cannot prevent this: it moves state to host RAM
    # only AFTER the state exists. Keeping the params on CPU does.
    - name: PARAM_OFFLOAD
      value: "True"
    # Adam state creation is one large transient; expandable segments stop the
    # caching allocator from failing on fragmentation alone.
    - name: PYTORCH_CUDA_ALLOC_CONF
      value: "expandable_segments:True"
    - name: HF_HOME
      value: "/workspace/hf"         # model + dataset cache, per node (no shared volume)
    # Precautionary NCCL settings around cuda-checkpoint; keep as set.
    - name: NCCL_CUMEM_ENABLE
      value: "0"
    - name: NCCL_NVLS_ENABLE
      value: "0"
    - name: ACTOR_LR
      value: "1e-6"
    - name: EXP_NAME
      value: "rl-batch-code-l4"
    # L4: offload Adam states to host RAM (see header).
    - name: OPTIMIZER_OFFLOAD
      value: "True"
    - name: ROLLOUT_GPU_FRAC
      # L4 fix: the rollout engine must leave headroom for the nccl
      # weight-sync buffer. At 0.8 the trainer's update_weights OOMed
      # ("tried to allocate 2.00 GiB, 1.54 GiB free") and the timeslice
      # integration's crash-release FAULTED the whole group.
      value: "0.55"
    # verl install source (runtime install, as in the prototype); point at
    # mainline verl once the lifecycle-hook commits land upstream.
    - name: VERL_REPO
      value: "https://github.com/aishukamal/verl.git"
    - name: VERL_REF
      value: "feat/fully-async-lifecycle-hooks"
    # --- timeslice trainer (lock protocol via verl lifecycle hooks) ---
    - name: TIMESLICE_FULLY_ASYNC
      value: "1"
    - name: TIMESLICE_JOB_ID
      value: "__JOB__"            # must equal the timeslice.io/job-id label
    - name: TIMESLICE_ORCH_ADDR
      value: "timeslice-timesliceorchestrator.timeslice-system.svc:50051"
    - name: TIMESLICE_GROUP
      value: "__GROUP__"
    command: ["/bin/bash", "-c"]
    args:
    - |
      set -euo pipefail
      echo "=== current-integration demo: RL trainer — HEAD (shared L4 node) ==="
      echo "Node: $(hostname)"; echo "Date: $(date)"
      mkdir -p /workspace/results
      bash /opt/timeslice-demo/run_head.sh 2>&1 | tee /workspace/results/experiment.log
    ports:
    - containerPort: 6379            # ray GCS (behind headless Service rl-head)
    - containerPort: 8265            # ray dashboard (optional)
    resources:
      requests:
        cpu: "8"
        memory: "40Gi"
      limits:
        memory: "64Gi"   # RSS + offloaded Adam states + cuda-checkpoint dump (<=24Gi GPU)
      claims:
      - name: accelerator
    volumeMounts:
    - name: results
      mountPath: /workspace/results
    - name: dshm
      mountPath: /dev/shm
  volumes:
  - name: results
    emptyDir: {}
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 8Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: rl-rollout
  namespace: __NS__
  labels:
    app: rl-rollout
    # NO timeslice.io labels: this pod must NEVER be selected for snapshot —
    # the rollout engine keeps generating while the trainer is checkpointed.
spec:
  restartPolicy: Never
  # Placement: any GPU node except the trainer node. The GPU comes from the
  # ordinary device plugin (nvidia.com/gpu below); the anti-affinity keeps
  # this pod off the trainer node, whose GPU is claim-managed.
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: group.timeslice.io/__GROUP__
            operator: DoesNotExist
  tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoSchedule
  - key: timeslice.io/shared
    operator: Equal
    value: "true"
    effect: NoSchedule
  containers:
  - name: rollout
    image: __REGISTRY__/rl-trainer:v0.1.6
    env:
    - name: VLLM_USE_V1
      value: "1"
    # MUST match the head: run_rollout.sh tokenises the dataset with MODEL_ID,
    # and the two pods must produce identical prompts.
    - name: MODEL_ID
      value: "Qwen/Qwen2.5-0.5B-Instruct"
    - name: HF_HOME
      value: "/workspace/hf"         # model downloads land here, per node
    - name: NCCL_CUMEM_ENABLE
      value: "0"
    - name: NCCL_NVLS_ENABLE
      value: "0"
    - name: VERL_REPO
      value: "https://github.com/aishukamal/verl.git"
    - name: VERL_REF
      value: "feat/fully-async-lifecycle-hooks"
    # The trainer driver actor (the registered timeslice trainer subclass)
    # is a CPU-only Ray actor that can be scheduled on either Ray node and
    # inherits the raylet's env, not the driver's — keep the timeslice env
    # identical on both pods.
    - name: TIMESLICE_FULLY_ASYNC
      value: "1"
    - name: TIMESLICE_JOB_ID
      value: "__JOB__"
    - name: TIMESLICE_ORCH_ADDR
      value: "timeslice-timesliceorchestrator.timeslice-system.svc:50051"
    - name: TIMESLICE_GROUP
      value: "__GROUP__"
    command: ["/bin/bash", "-c"]
    args:
    - |
      set -euo pipefail
      echo "=== current-integration demo: RL trainer — ROLLOUT (dedicated L4 node) ==="
      echo "Node: $(hostname)"; echo "Date: $(date)"
      mkdir -p /workspace/results
      bash /opt/timeslice-demo/run_rollout.sh 2>&1 | tee /workspace/results/experiment.log
    resources:
      requests:
        cpu: "12"
        memory: "60Gi"
      limits:
        nvidia.com/gpu: "1"          # ordinary device-plugin GPU (no claim)
    volumeMounts:
    - name: results
      mountPath: /workspace/results
    - name: dshm
      mountPath: /dev/shm
  volumes:
  - name: results
    emptyDir: {}
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 16Gi
---
# Headless Service: stable DNS for the ray head; the rollout pod joins via
# rl-head.default.svc.cluster.local:6379.
apiVersion: v1
kind: Service
metadata:
  name: rl-head
  namespace: __NS__
spec:
  clusterIP: None
  selector:
    app: rl-head
  ports:
  - name: ray-gcs
    port: 6379
    targetPort: 6379
  - name: ray-dashboard
    port: 8265
    targetPort: 8265
