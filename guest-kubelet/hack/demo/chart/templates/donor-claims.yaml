{{- if eq .Values.donor.kind "rayjob" }}
# One GPU claim per RL pod (each trainer on its own host, the sampler on the control node).
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata: {name: {{ .Values.donor.claimTemplate }}, namespace: {{ include "demo.app" . }}}
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly: {deviceClassName: {{ .Values.donor.deviceClass }}, allocationMode: ExactCount, count: 1}
{{- else if eq .Values.donor.kind "pod" }}
# The shared claim of the stand-in trainer; the guest kubelet's --gpu-claim names it (static
# mode), so each mirror joins its reservedFor.
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata: {name: {{ .Values.donor.claim }}, namespace: {{ include "demo.app" . }}}
spec:
  devices:
    requests:
      - name: gpu
        exactly: {deviceClassName: {{ .Values.donor.deviceClass }}, allocationMode: ExactCount, count: 1}
{{- end }}
