{{- if eq .Values.donor.kind "rayjob" }}
{{- $r := .Values.donor.rayjob }}
{{- $n := len .Values.hosts }}
{{- if not $r.image }}{{ fail "donor.rayjob.image is required" }}{{ end }}
{{- if not .Values.runLabel }}{{ fail "runLabel is required (the trainers select timeslice.io/stack-run=<runLabel>)" }}{{ end }}
{{- if and $r.sampler.expandableSegments (not $r.sampler.sysPtrace) }}{{ fail "donor.rayjob.sampler.expandableSegments needs sampler.sysPtrace (pidfd_getfd); see README.md" }}{{ end }}
# The RL donor: a KubeRay RayJob running verl fully-async (guest-kubelet/hack/demo/rl/rl-rayjob.yaml)
# with one trainer per group host (trainer.nnodes = the number of hosts), each with its own GPU
# claim, placed by the hosts' slot label; the head and the sampler run on the control node. The
# trainer pods carry the donor labels (timeslice.io/donor, job-id, group) the orchestrator and the
# guest kubelet (--gpu-claim-mode=donor) read.
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: {{ .Values.donor.jobId }}
  namespace: {{ include "demo.app" . }}
spec:
  jobId: {{ .Values.donor.jobId }}
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 600
  # The head has num-cpus 0, so the driver runs on a prepped worker.
  entrypointNumCpus: 1
  entrypoint: >-
    timeout --signal=INT --kill-after=120 {{ $r.timeoutS }}
    python3 -m verl.experimental.fully_async_policy.fully_async_main
    data.train_files=/workspace/data/eurus_code/train.parquet
    data.val_files=/workspace/data/eurus_code/val.parquet
    data.prompt_key=prompt
    data.truncation=left
    data.max_prompt_length=2048
    data.max_response_length=6144
    data.train_batch_size=0
    data.gen_batch_size=1
    data.return_raw_chat=True
    actor_rollout_ref.model.path=Qwen/Qwen2.5-0.5B-Instruct
    actor_rollout_ref.model.use_remove_padding=True
    actor_rollout_ref.model.enable_gradient_checkpointing=True
    actor_rollout_ref.hybrid_engine=False
    actor_rollout_ref.actor.strategy=fsdp
    actor_rollout_ref.actor.ppo_mini_batch_size={{ $r.miniBatch }}
    actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1
    actor_rollout_ref.actor.use_kl_loss=False
    actor_rollout_ref.actor.kl_loss_coef=0.0
    actor_rollout_ref.actor.entropy_coeff=0
    actor_rollout_ref.actor.grad_clip=1.0
    actor_rollout_ref.actor.loss_agg_mode=token-mean
    actor_rollout_ref.actor.use_dynamic_bsz=True
    actor_rollout_ref.actor.ppo_max_token_len_per_gpu=8192
    actor_rollout_ref.actor.optim.lr=1e-6
    actor_rollout_ref.actor.optim.lr_warmup_steps=-1
    actor_rollout_ref.actor.fsdp_config.param_offload=True
    actor_rollout_ref.actor.fsdp_config.optimizer_offload=True
    actor_rollout_ref.ref.log_prob_use_dynamic_bsz=True
    actor_rollout_ref.ref.log_prob_max_token_len_per_gpu=8192
    actor_rollout_ref.rollout.name=vllm
    actor_rollout_ref.rollout.mode=async
    actor_rollout_ref.rollout.n=4
    actor_rollout_ref.rollout.calculate_log_probs=True
    actor_rollout_ref.rollout.checkpoint_engine.backend=nccl
    +actor_rollout_ref.rollout.checkpoint_engine.engine_kwargs.nccl.rebuild_group=True
    actor_rollout_ref.rollout.gpu_memory_utilization=0.55
    actor_rollout_ref.rollout.tensor_model_parallel_size=1
    actor_rollout_ref.rollout.max_model_len=8192
    actor_rollout_ref.rollout.max_num_batched_tokens=8192
    actor_rollout_ref.rollout.enable_chunked_prefill=True
    actor_rollout_ref.rollout.temperature=1.0
    actor_rollout_ref.rollout.top_p=1.0
    actor_rollout_ref.rollout.top_k=-1
    algorithm.adv_estimator=grpo
    algorithm.use_kl_in_reward=False
    algorithm.kl_ctrl.kl_coef=0.0
    'trainer.logger=[console]'
    trainer.val_before_train=False
    trainer.save_freq=-1
    trainer.resume_mode=disable
    trainer.nnodes={{ $n }}
    trainer.n_gpus_per_node=1
    trainer.total_epochs={{ $r.totalEpochs }}
    trainer.test_freq=-1
    trainer.project_name=timeslice-demo
    trainer.experiment_name=rl-batch-code-l4
    trainer.default_local_dir=/workspace/results/ckpts
    rollout.nnodes=1
    rollout.n_gpus_per_node=1
    rollout.total_rollout_steps=65536
    async_training.staleness_threshold={{ $r.staleness }}
    async_training.trainer_name=timeslice
    async_training.trigger_parameter_sync_step=1
    async_training.use_dynamic_resource_scheduling=False
    async_training.use_trainer_do_validate=False
    "'ray_pg_extra_resources={trainer_pool:{trainer_node:1},rollout_pool:{rollout_node:1}}'"
  # Reaches every actor of the job, on any Ray node: the timeslice trainer driver actor is
  # CPU-only and can land on either worker.
  runtimeEnvYAML: |
    env_vars:
      TIMESLICE_FULLY_ASYNC: "1"
      TIMESLICE_JOB_ID: {{ .Values.donor.jobId | quote }}
      TIMESLICE_GROUP: {{ .Values.donor.group | quote }}
      TIMESLICE_ORCH_ADDR: {{ .Values.donor.orchAddr | quote }}
      TIMESLICE_EXPECTED_IDLE: {{ $r.expectedIdle | toString | quote }}
      {{- range $k, $v := $r.extraEnv }}
      {{ $k }}: {{ $v | toString | quote }}
      {{- end }}
  rayClusterSpec:
    headGroupSpec:
      rayStartParams:
        num-cpus: "0"
        dashboard-host: "0.0.0.0"
      template:
        metadata:
          labels:
            {{- toYaml .Values.donor.labels | nindent 12 }}
        spec:
          {{- include "demo.controlSelector" . | nindent 10 }}
          containers:
            - name: ray-head
              image: {{ $r.image }}
              resources:
                requests: {cpu: "2", memory: 8Gi}
                limits: {memory: 8Gi}
    workerGroupSpecs:
      - groupName: trainers
        replicas: {{ $n }}
        rayStartParams:
          num-gpus: "1"
          num-cpus: "24"
          resources: "'{\"trainer_node\": 100}'"
        template:
          metadata:
            labels:
              {{- toYaml .Values.donor.labels | nindent 14 }}
              ev-rl-role: trainer
              timeslice.io/donor: "true"
              timeslice.io/job-id: {{ .Values.donor.jobId }}
              timeslice.io/group: {{ .Values.donor.group }}
          spec:
            nodeSelector:
              timeslice.io/stack-run: {{ .Values.runLabel }}
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - {key: {{ .Values.slotLabel }}, operator: In, values: [{{ include "demo.slots" . }}]}
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels: {ev-rl-role: trainer}
                    topologyKey: kubernetes.io/hostname
            tolerations: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}]
            resourceClaims:
              - name: accelerator
                resourceClaimTemplateName: {{ .Values.donor.claimTemplate }}
            {{- if $r.clientOverlayConfigMap }}
            volumes:
              - name: client-overlay
                configMap: {name: {{ $r.clientOverlayConfigMap }}}
            {{- end }}
            containers:
              - name: ray-worker
                image: {{ $r.image }}
                {{- if $r.clientOverlayConfigMap }}
                volumeMounts:
                  - {name: client-overlay, mountPath: /opt/client-overlay, readOnly: true}
                {{- end }}
                env:
                  {{- include "demo.rlEnv" $r | nindent 18 }}
                  - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True"}
                # Per-node prep; KubeRay appends its Ray start after these args.
                args:
                  {{- include "demo.rlWorkerArgs" $r | nindent 18 }}
                # The prep takes 20-45 min; KubeRay's default liveness probe would restart the pod
                # before the raylet exists.
                livenessProbe:
                  exec: {command: ["true"]}
                resources:
                  requests:
                    {{- toYaml $r.trainer.requests | nindent 20 }}
                  limits:
                    {{- toYaml $r.trainer.limits | nindent 20 }}
                  claims: [{name: accelerator}]
      - groupName: samplers
        replicas: 1
        rayStartParams:
          num-gpus: "1"
          num-cpus: "24"
          resources: "'{\"rollout_node\": 100}'"
        template:
          metadata:
            labels:
              {{- toYaml .Values.donor.labels | nindent 14 }}
              ev-rl-role: sampler
          spec:
            {{- include "demo.controlSelector" . | nindent 12 }}
            resourceClaims:
              - name: accelerator
                resourceClaimTemplateName: {{ .Values.donor.claimTemplate }}
            {{- if $r.clientOverlayConfigMap }}
            volumes:
              - name: client-overlay
                configMap: {name: {{ $r.clientOverlayConfigMap }}}
            {{- end }}
            containers:
              - name: ray-worker
                image: {{ $r.image }}
                {{- if $r.sampler.sysPtrace }}
                # verl's bucketed weight transfer imports CUDA memory across processes in this pod;
                # with expandable segments PyTorch does it with pidfd_getfd, refused without
                # CAP_SYS_PTRACE.
                securityContext:
                  capabilities: {add: [SYS_PTRACE]}
                {{- end }}
                {{- if $r.clientOverlayConfigMap }}
                volumeMounts:
                  - {name: client-overlay, mountPath: /opt/client-overlay, readOnly: true}
                {{- end }}
                env:
                  {{- include "demo.rlEnv" $r | nindent 18 }}
                  {{- if $r.sampler.expandableSegments }}
                  - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True"}
                  {{- end }}
                args:
                  {{- include "demo.rlWorkerArgs" $r | nindent 18 }}
                livenessProbe:
                  exec: {command: ["true"]}
                resources:
                  requests:
                    {{- toYaml $r.sampler.requests | nindent 20 }}
                  limits:
                    {{- toYaml $r.sampler.limits | nindent 20 }}
                  claims: [{name: accelerator}]
{{- end }}
