# Runs every check remotely: nothing is built or tested on a laptop.
#   gcloud builds submit --project=YOUR_PROJECT --config cloudbuild.yaml --substitutions=_TAG=$(git rev-parse --short HEAD)
# First build only (no go.sum yet): add _ALLOW_TIDY=true, then commit the go.mod/go.sum
# that the build uploads to gs://${PROJECT_ID}_cloudbuild/guest-kubelet/${BUILD_ID}/.
substitutions:
  _REGION: YOUR_REGION
  _REPO: guest-kubelet
  _TAG: dev
  _ALLOW_TIDY: "false"
  _ALLOW_REGEN: "false"
options:
  logging: GCS_ONLY
  machineType: E2_HIGHCPU_8
steps:
  # Generates the host command server and the snapshot-agent client from api/ (copied from the
  # fork's protos) and checks they match the committed code. _ALLOW_REGEN=true writes the new code into api/ for
  # the later steps and uploads it; commit what the build uploads.
  - id: proto
    name: golang:1.26
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y -qq unzip >/dev/null
        curl -sSLo /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-x86_64.zip
        unzip -q -o /tmp/protoc.zip -d /tmp/protoc
        GOBIN=/tmp/protoc/bin go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
        GOBIN=/tmp/protoc/bin go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
        export PATH=/tmp/protoc/bin:$$PATH
        gen() {
          D=api/$$1/v1alpha1
          M=M$$2=github.com/edwinhr716/guest-kubelet/$$D
          mkdir -p out/$$D
          protoc -I $$D -I /tmp/protoc/include \
            --go_out=out/$$D --go_opt=paths=source_relative,$$M \
            --go-grpc_out=out/$$D --go-grpc_opt=paths=source_relative,$$M \
            $$D/$$2
          if ! diff -r -q out/$$D $$D --exclude='*.proto'; then
            if [ "${_ALLOW_REGEN}" != "true" ]; then echo "generated code is stale; rerun with _ALLOW_REGEN=true"; exit 1; fi
            cp out/$$D/*.pb.go $$D/
            echo "generated code was rewritten (allowed); commit out/$$D/*.pb.go"
          fi
        }
        gen hostcommand host_command.proto
        gen snapshotagent snapshot_agent.proto
  - id: tidy
    name: golang:1.26
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        mkdir -p /tmp/orig out
        cp go.mod /tmp/orig/; touch go.sum; cp go.sum /tmp/orig/
        go mod tidy
        cp go.mod go.sum out/
        if ! diff -q /tmp/orig/go.mod go.mod || ! diff -q /tmp/orig/go.sum go.sum; then
          if [ "${_ALLOW_TIDY}" != "true" ]; then echo "go.mod/go.sum not tidy"; exit 1; fi
          echo "go.mod/go.sum were rewritten (allowed); commit out/go.mod and out/go.sum"
        fi
  - id: vet-test-build
    name: golang:1.26
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        go vet ./...
        go test -race ./...
        CGO_ENABLED=0 go build -o out/guest-kubelet ./cmd/guest-kubelet
        CGO_ENABLED=0 go build -o out/q5-measure ./cmd/q5-measure
  - id: image
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/guest-kubelet:${_TAG}", "."]
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/guest-kubelet:${_TAG}
artifacts:
  objects:
    location: gs://${PROJECT_ID}_cloudbuild/guest-kubelet/${BUILD_ID}/
    paths: ["out/go.mod", "out/go.sum", "out/api/hostcommand/v1alpha1/*.pb.go", "out/api/snapshotagent/v1alpha1/*.pb.go"]
