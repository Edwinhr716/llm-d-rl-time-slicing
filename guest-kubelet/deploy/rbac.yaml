# What the virtual-kubelet library and the mirror backend call, and nothing more.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: guest-kubelet-proto
rules:
  # update: add the timeslice.io/virtual-node-protection finalizer and the ownerReference to the
  # host on an existing Node, and remove the finalizer on --deregister (D-VK-2 option c).
  # delete: --deregister.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["nodes/status"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    # create/update/delete: mirror pods (M1). Update is only used to re-adopt a mirror.
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["update", "patch"]
  # Only used with --guest-probe-policy=c (lead decision D-VK-5): exec readiness and startup
  # probes run inside the mirror's container through the API server.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  # The pod controller starts informers on these to resolve env vars in pod specs.
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services"]
    verbs: ["list", "watch"]
  # M1: only for --reserve-claim=true (kube-controller-manager already reserves claims for
  # pods created with spec.nodeName).
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims"]
    verbs: ["get"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims/status"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: guest-kubelet-proto
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: guest-kubelet-proto
subjects:
  - kind: ServiceAccount
    name: guest-kubelet
    namespace: guest-kubelet-proto
---
# Node heartbeat Leases live in one namespace, so a namespaced Role is enough.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: guest-kubelet-proto
  namespace: kube-node-lease
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: guest-kubelet-proto
  namespace: kube-node-lease
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: guest-kubelet-proto
subjects:
  - kind: ServiceAccount
    name: guest-kubelet
    namespace: guest-kubelet-proto
---
# M1: leader election between the replicas, on a Lease in the VK's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: guest-kubelet-leader
  namespace: guest-kubelet-proto
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: guest-kubelet-leader
  namespace: guest-kubelet-proto
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: guest-kubelet-leader
subjects:
  - kind: ServiceAccount
    name: guest-kubelet
    namespace: guest-kubelet-proto
