# What the virtual-kubelet library calls, and nothing more (M0 creates no pods).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: guest-kubelet-proto
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["nodes/status"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["update", "patch"]
  # The pod controller starts informers on these to resolve env vars in pod specs.
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: guest-kubelet-proto
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: guest-kubelet-proto
subjects:
  - kind: ServiceAccount
    name: guest-kubelet
    namespace: guest-kubelet-proto
---
# Node heartbeat Leases live in one namespace, so a namespaced Role is enough.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: guest-kubelet-proto
  namespace: kube-node-lease
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: guest-kubelet-proto
  namespace: kube-node-lease
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: guest-kubelet-proto
subjects:
  - kind: ServiceAccount
    name: guest-kubelet
    namespace: guest-kubelet-proto
