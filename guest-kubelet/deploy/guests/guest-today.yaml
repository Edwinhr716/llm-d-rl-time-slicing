# Guest manifest, today's form (pending lead decision D-NS-3, option keep). The guest tolerates
# the virtual Node's taint and requires a virtual Node through nodeSelector, so it waits Pending
# when no virtual Node exists or has room. It carries no timeslice.io label.
# Use with --guest-marker=toleration or both.
apiVersion: v1
kind: Pod
metadata:
  name: guest-today
  labels: {app: guest-today}
spec:
  nodeSelector:
    timeslice.io/virtual-node: "true"
  tolerations:
    - {key: timeslice.io/guest, operator: Exists, effect: NoSchedule}
  containers:
    - name: echo
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: ["netexec", "--http-port=8080"]
      resources:
        requests: {cpu: 100m, memory: 64Mi}
