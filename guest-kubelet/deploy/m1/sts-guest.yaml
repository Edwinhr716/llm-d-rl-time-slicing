# Re-adoption test: a StatefulSet re-creates its pod with the same name (new UID) after the
# old one is force-deleted, so the guest kubelet can re-adopt the surviving mirror.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sts-echo
  namespace: guest-kubelet-proto
spec:
  replicas: 1
  serviceName: sts-echo
  selector:
    matchLabels: {app: sts-echo}
  template:
    metadata:
      labels: {app: sts-echo}
    spec:
      nodeSelector:
        kubernetes.io/hostname: __VNODE__
      tolerations:
        - {key: timeslice.io/guest, operator: Exists, effect: NoSchedule}
      containers:
        - name: echo
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
