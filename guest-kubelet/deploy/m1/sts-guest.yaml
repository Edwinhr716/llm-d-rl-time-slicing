# StatefulSet guest: after the old pod is force-deleted, the StatefulSet re-creates it with the
# same name and a new UID. The old mirror is garbage-collected with the old pod (its owner) and
# the guest kubelet creates a new one for the new pod, or re-adopts the old mirror if the
# collector has not reached it yet.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sts-echo
  namespace: guest-kubelet-proto
spec:
  replicas: 1
  serviceName: sts-echo
  selector:
    matchLabels: {app: sts-echo}
  template:
    metadata:
      labels: {app: sts-echo}
    spec:
      nodeSelector:
        kubernetes.io/hostname: __VNODE__
      tolerations:
        - {key: timeslice.io/guest, operator: Exists, effect: NoSchedule}
      containers:
        - name: echo
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args: ["netexec", "--http-port=8080"]
          resources:
            requests: {cpu: 50m, memory: 32Mi}
