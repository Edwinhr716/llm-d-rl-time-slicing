# Pending lead decision D-NS-11, option ns-ds: the guest kubelet as a DaemonSet that runs only on
# nodes labelled timeslice.io/donor=true (late bound). Labelling a node is what schedules a guest
# kubelet onto it; removing the label stops it. deployment.yaml (option keep) stays the default.
# The virtual Node is vk-<last part of the host name> (no --node-name; --host-node comes from
# NODE_NAME), and the virtual Node never carries timeslice.io/donor, so this DaemonSet never
# targets it. RBAC is rbac.yaml. `make deploy-ds` replaces __IMAGE__.
# The snapshot agent follows the same label: deploy/opt-d-ns-11/snapshot-agent-values.yaml.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: guest-kubelet
  namespace: guest-kubelet-proto
spec:
  updateStrategy:
    # As the Deployment: the new pod starts next to the old one on the same node, and leader
    # election on the per-Node Lease hands the kubelet role over (the old leader releases it on
    # exit). A standby binds no host port, so the surge pod fits next to the leader.
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: guest-kubelet}
  template:
    metadata:
      labels: {app: guest-kubelet}
    spec:
      serviceAccountName: guest-kubelet
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 10
      nodeSelector:
        timeslice.io/donor: "true"
      tolerations:
        - {key: timeslice.io/shared, operator: Exists, effect: NoSchedule}
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
        # --gpu-mode=deviceplugin: the fence taint this guest kubelet puts on the host while a
        # mirror still runs on a departed donor's GPU must not block a restart of the kubelet itself.
        - {key: timeslice.io/gpu-fence, operator: Exists, effect: NoSchedule}
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: guest-kubelet
          image: __IMAGE__
          args:
            - --leader-elect=true
            - --gpu-claim=shared-m1-gpu-claim
            - --mirror-cpu-headroom=1
            - --mirror-memory-headroom=4Gi
            - --mirror-owner-ref=true
            # M4: the node's snapshot agent (hostNetwork, same node). Empty disables suspend.
            - --agent-addr=$(HOST_IP):9101
            # K and N (pending lead decision): read from the demo config.
            - --kill-budget=3s
            - --notice-window=30s
            # D-NS-8 ns-cordon: SchedulingDisabled while a guest is suspended (false = skip).
            - --cordon-while-held=true
            # Test hooks (M2: force a guest's readiness, read its Ready edges; M3: suspend and
            # resume by hand); loopback only.
            - --debug-addr=127.0.0.1:10261
            # D-NS-4 ns-push-vk host commands, off by default. To turn them on, uncomment and set
            # the port the orchestrator uses (its --host-command-port) and the allow-list: the
            # orchestrator pod IPs or CIDRs allowed to send commands (empty allows every caller).
            # --freezer=agent suspends through the node's snapshot agent at --snapshot-agent-port.
            # - --host-command-port=9112
            # - --host-command-allow=10.0.0.0/8
            # - --freezer=agent
            # - --snapshot-agent-port=9101
          env:
            - name: HOST_IP
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          # Guaranteed QoS: the last thing evicted under node pressure.
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 100m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
