# M1: two replicas on the host node with leader election; only the Lease holder is the kubelet.
# M4: unprivileged; suspend, resume and kill are calls to the node's snapshot agent
# (host network, port 9101). The guest kubelet never touches cgroups.
# `make deploy` replaces __IMAGE__ with the Artifact Registry image and __HOST__ with the host node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guest-kubelet
  namespace: guest-kubelet-proto
spec:
  replicas: 2
  strategy:
    # Leader election, not Recreate, keeps it to one kubelet per Node, so a rollout can
    # start the new pod before the old one stops (the old leader releases the Lease on exit).
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: guest-kubelet}
  template:
    metadata:
      labels: {app: guest-kubelet}
    spec:
      serviceAccountName: guest-kubelet
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 10
      nodeSelector:
        kubernetes.io/hostname: __HOST__
      tolerations:
        - {key: timeslice.io/shared, operator: Exists, effect: NoSchedule}
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
        # --gpu-mode=deviceplugin: the fence taint this guest kubelet puts on the host while a
        # mirror still runs on a departed donor's GPU must not block a restart of the kubelet itself.
        - {key: timeslice.io/gpu-fence, operator: Exists, effect: NoSchedule}
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: guest-kubelet
          image: __IMAGE__
          args:
            - --leader-elect=true
            - --gpu-claim=shared-m1-gpu-claim
            - --mirror-cpu-headroom=1
            - --mirror-memory-headroom=4Gi
            - --mirror-owner-ref=true
            # M4: the node's snapshot agent (hostNetwork, same node). Empty disables suspend.
            - --agent-addr=$(HOST_IP):9101
            # K and N (pending lead decision): read from the demo config.
            - --kill-budget=3s
            - --notice-window=30s
            # D-NS-8 ns-cordon: SchedulingDisabled while a guest is suspended (false = skip).
            - --cordon-while-held=true
            # Test hooks (M2: force a guest's readiness, read its Ready edges; M3: suspend and
            # resume by hand); loopback only.
            - --debug-addr=127.0.0.1:10261
          env:
            - name: HOST_IP
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          # Guaranteed QoS: the last thing evicted under node pressure.
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 100m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
