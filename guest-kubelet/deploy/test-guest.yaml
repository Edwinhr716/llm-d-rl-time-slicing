# A guest: it tolerates the guest taint by key and selects the virtual node.
# Nothing runs; the VK reports it Running with a fake IP from 198.18.0.0/15.
apiVersion: v1
kind: Pod
metadata:
  name: echo-guest
  namespace: guest-kubelet-proto
  labels: {app: echo-guest}
spec:
  nodeSelector:
    kubernetes.io/hostname: vk-abcd
  tolerations:
    - {key: timeslice.io/guest, operator: Exists, effect: NoSchedule}
  containers:
    - name: echo
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: ["netexec", "--http-port=8080"]
      ports: [{containerPort: 8080}]
      resources:
        requests: {cpu: 100m, memory: 64Mi, nvidia.com/gpu: 1}
        limits: {nvidia.com/gpu: 1}
---
apiVersion: v1
kind: Service
metadata:
  name: echo-guest
  namespace: guest-kubelet-proto
spec:
  selector: {app: echo-guest}
  ports: [{port: 80, targetPort: 8080}]
