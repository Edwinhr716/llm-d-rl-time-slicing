# Step one: a CPU-only guest. It tolerates the guest taint by key and selects the virtual
# node; the guest kubelet runs it as echo-guest-m on the real node.
apiVersion: v1
kind: Pod
metadata:
  name: echo-guest
  namespace: guest-kubelet-proto
  labels: {app: echo-guest}
spec:
  nodeSelector:
    kubernetes.io/hostname: __VNODE__
  tolerations:
    - {key: timeslice.io/guest, operator: Exists, effect: NoSchedule}
  containers:
    - name: echo
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: ["netexec", "--http-port=8080"]
      ports: [{containerPort: 8080}]
      resources:
        requests: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: echo-guest
  namespace: guest-kubelet-proto
spec:
  selector: {app: echo-guest}
  ports: [{port: 80, targetPort: 8080}]
