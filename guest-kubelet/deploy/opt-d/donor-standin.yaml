# D-VK-2 option d: stand-in for the donor controller's host-death duty. When the real Node
# __HOST__ is gone for good it deletes the virtual Node __VK_NODE__ (the policy in policy.yaml
# lets only this service account and the guest-kubelet do that); the pod garbage collector then
# deletes the guests, so their controllers retry elsewhere. It must not run on __HOST__: on host
# death the guest-kubelet dies with the host, the stand-in must not.
# Placeholders as in policy.yaml, plus __IMAGE__ (the guest-kubelet image; it holds both binaries).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: donor-standin
  namespace: guest-kubelet-proto
---
# Only Node objects, and only these two.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: guest-kubelet-proto-donor-standin
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    resourceNames: ["__HOST__", "__VK_NODE__"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes"]
    resourceNames: ["__VK_NODE__"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: guest-kubelet-proto-donor-standin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: guest-kubelet-proto-donor-standin
subjects:
  - kind: ServiceAccount
    name: donor-standin
    namespace: guest-kubelet-proto
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: donor-standin
  namespace: guest-kubelet-proto
  labels: {app: donor-standin, timeslice.io/eval-role: donor-standin}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: donor-standin}
  template:
    metadata:
      labels: {app: donor-standin, timeslice.io/eval-role: donor-standin}
    spec:
      serviceAccountName: donor-standin
      terminationGracePeriodSeconds: 5
      # A CPU node, never the host (GKE's default node pool; change it for other clusters).
      nodeSelector:
        cloud.google.com/gke-nodepool: default-pool
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: donor-standin
          image: __IMAGE__
          command: ["/donor-standin"]
          args:
            - --vk-node=__VK_NODE__
            - --host-node=__HOST__
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
