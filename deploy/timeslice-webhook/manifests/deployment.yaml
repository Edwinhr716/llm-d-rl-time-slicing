# Timeslice admission webhook server. Placeholders, replaced at install time:
#   __NS__          namespace of the webhook
#   __IMAGE__       image built by deploy/timeslice-webhook/cloudbuild.yaml
#   __PORT__        HTTPS port (8443; 10250 on a private GKE control plane without a firewall rule)
#   __TLS_SECRET__  kubernetes.io/tls Secret with tls.crt and tls.key for timeslice-webhook.__NS__.svc
#   the placeholder line under args: is replaced by the webhook flags, one "- --flag=value" item each
# No ServiceAccount token, no RBAC: the webhook never calls the API server.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timeslice-webhook
  namespace: __NS__
  labels:
    app.kubernetes.io/name: timeslice-webhook
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: timeslice-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: timeslice-webhook
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: timeslice-webhook
      containers:
        - name: webhook
          image: __IMAGE__
          command:
            - /timeslice-webhook
            - --port=__PORT__
            - --cert-dir=/etc/timeslice-webhook/certs
          args:
            __EXTRA_ARGS__
          ports:
            - name: https
              containerPort: __PORT__
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: certs
              mountPath: /etc/timeslice-webhook/certs
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: __TLS_SECRET__
