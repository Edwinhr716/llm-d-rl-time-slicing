# CEL rules for the pods the webhook does not see, so they never depend on the webhook being up.
#   W10  timeslice.io/role is set only by the virtual kubelet (mirror pods carry no donor/guest label)
#   W6   a pod with timeslice.io/group also carries timeslice.io/job-id
#   W9   a guest carries no group, job-id or role label (also enforced while the guest entry is down)
#   W2   a guest requests no resource claims (same)
#   W12  a guest container is not privileged (CREATE only; also enforced while the guest entry is down)
# Placeholder __VK_USERNAME__: the virtual kubelet's user name,
# system:serviceaccount:<ns>:<name>, the same identity as the webhook's --vk-service-account.
# Its requests are not checked (mirror passthrough, W7). On UPDATE a rule is checked only when the
# labels change, so an existing pod can always be updated otherwise (for example to drop a finalizer).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: timeslice-webhook-pods
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: not-the-virtual-kubelet
      expression: "request.userInfo.username != '__VK_USERNAME__'"
  variables:
    - name: checked
      expression: >-
        request.operation == 'CREATE' ||
        has(object.metadata.labels) != has(oldObject.metadata.labels) ||
        (has(object.metadata.labels) && object.metadata.labels != oldObject.metadata.labels)
    - name: guest
      expression: >-
        has(object.metadata.labels) && 'timeslice.io/guest' in object.metadata.labels &&
        object.metadata.labels['timeslice.io/guest'] == 'true'
  validations:
    - expression: >-
        !variables.checked || !has(object.metadata.labels) ||
        !('timeslice.io/role' in object.metadata.labels)
      message: "[W10] timeslice.io/role is set only by the virtual kubelet on mirror pods; remove it"
      reason: Forbidden
    - expression: >-
        !variables.checked || !has(object.metadata.labels) ||
        !('timeslice.io/group' in object.metadata.labels) || 'timeslice.io/job-id' in object.metadata.labels
      message: >-
        [W6] a pod with timeslice.io/group needs timeslice.io/job-id; label it timeslice.io/donor=true
        to have both derived, or set both
      reason: Forbidden
    - expression: >-
        !variables.checked || !variables.guest ||
        !['timeslice.io/group', 'timeslice.io/job-id', 'timeslice.io/role'].exists(k, k in object.metadata.labels)
      message: >-
        [W9] a guest pod must not carry timeslice.io/group, timeslice.io/job-id or timeslice.io/role:
        they are set by the virtual kubelet on the mirror pod
      reason: Forbidden
    - expression: >-
        !variables.checked || !variables.guest ||
        ((!has(object.spec.resourceClaims) || size(object.spec.resourceClaims) == 0) &&
        !object.spec.containers.exists(c, has(c.resources) && has(c.resources.claims) && size(c.resources.claims) > 0))
      message: >-
        [W2] a guest pod must not request resource claims: the mirror pod runs on the donor's GPU
        through the virtual kubelet
      reason: Forbidden
    - expression: >-
        request.operation != 'CREATE' || !variables.guest ||
        (!object.spec.containers.exists(c, has(c.securityContext) && has(c.securityContext.privileged) &&
        c.securityContext.privileged) &&
        (!has(object.spec.initContainers) || !object.spec.initContainers.exists(c, has(c.securityContext) &&
        has(c.securityContext.privileged) && c.securityContext.privileged)))
      message: >-
        [W12] a guest container must not be privileged: a guest shares a GPU another pod holds and a
        privileged container sees every host device
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: timeslice-webhook-pods
spec:
  policyName: timeslice-webhook-pods
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: ["kube-system"]
