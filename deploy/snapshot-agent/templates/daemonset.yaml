apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "snapshot-agent.fullname" . }}
  namespace: timeslice-system
  labels:
    {{- include "snapshot-agent.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "snapshot-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "snapshot-agent.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "snapshot-agent.serviceAccountName" . }}
      hostNetwork: true
      hostPID: true
      hostIPC: true
      initContainers:
        # Mount hugetlbfs at the shared checkpoint path on the HOST. GPU-CR
        # relies on the filesystem itself being hugetlbfs (it does not pass
        # MAP_HUGETLB); without this mount every dump silently degrades to
        # boot-disk page cache and the node's hugepage pool goes unused.
        - name: mount-hugetlbfs
          image: alpine:latest
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              apk add --no-cache util-linux >/dev/null && \
              nsenter -t 1 -m -- sh -c 'mkdir -p /var/tmp/huge-ckpt; grep -q " /var/tmp/huge-ckpt hugetlbfs" /proc/mounts || mount -t hugetlbfs -o pagesize=2M,mode=0777 nodev /var/tmp/huge-ckpt; chmod 0777 /var/tmp/huge-ckpt' && \
              echo "hugetlbfs mounted at /var/tmp/huge-ckpt"
        - name: install-cuda-checkpoint
          image: alpine:latest
          command: ["sh", "-c", "apk add --no-cache wget && wget -qO /opt/bin/cuda-checkpoint https://raw.githubusercontent.com/NVIDIA/cuda-checkpoint/main/bin/x86_64_Linux/cuda-checkpoint && chmod +x /opt/bin/cuda-checkpoint && echo 'cuda-checkpoint installed'"]
          volumeMounts:
            - name: bin-dir
              mountPath: /opt/bin
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PATH
              value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/bin
            {{- if .Values.nvidia.driver.enabled }}
            - name: LD_LIBRARY_PATH
              value: {{ join ":" .Values.nvidia.driver.libraryPaths }}
            {{- end }}
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: AGENT_PORT
              value: {{ .Values.port | quote }}
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
            # Snapshot group copies must live on disk: hugetlbfs has no
            # write(2) support and copies there would pin hugepages forever.
            - name: SNAPSHOT_DIR
              value: /var/snapshots
          ports:
            - name: grpc
              containerPort: {{ .Values.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: bin-dir
              mountPath: /opt/bin
            {{- if .Values.nvidia.driver.enabled }}
            - name: nvidia-driver
              mountPath: {{ .Values.nvidia.driver.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.nvidia.devices.enabled }}
            - name: nvidia-devices
              mountPath: {{ .Values.nvidia.devices.mountPath }}
            {{- end }}
            - name: huge-ckpt
              mountPath: /mnt/huge-ckpt
              # Pick up the hugetlbfs mount made by the init container even
              # though the hostPath was prepared before it ran.
              mountPropagation: HostToContainer
            - name: gcr-snapshots
              mountPath: /var/snapshots
      volumes:
        - name: bin-dir
          emptyDir: {}
        {{- if .Values.nvidia.driver.enabled }}
        - name: nvidia-driver
          hostPath:
            path: {{ .Values.nvidia.driver.hostPath }}
            type: Directory
        {{- end }}
        {{- if .Values.nvidia.devices.enabled }}
        - name: nvidia-devices
          hostPath:
            path: {{ .Values.nvidia.devices.hostPath }}
            type: Directory
        {{- end }}
        - name: huge-ckpt
          hostPath:
            path: /var/tmp/huge-ckpt
            type: DirectoryOrCreate
        - name: gcr-snapshots
          hostPath:
            path: /var/tmp/gcr-snapshots
            type: DirectoryOrCreate
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}