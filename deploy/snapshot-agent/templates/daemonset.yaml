apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "snapshot-agent.fullname" . }}
  namespace: timeslice-system
  labels:
    {{- include "snapshot-agent.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "snapshot-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "snapshot-agent.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "snapshot-agent.serviceAccountName" . }}
      hostNetwork: true
      hostPID: true
      {{- if .Values.memoryRegions.enabled }}
      # GPU-CR uses a host-shared-memory control channel between the agent's
      # cr_client and the workload's preloader.
      hostIPC: true
      {{- if .Values.memoryRegions.hugetlbfs.mount }}
      initContainers:
        # Mount hugetlbfs at the shared checkpoint path on the HOST. GPU-CR
        # relies on the filesystem itself being hugetlbfs (it does not pass
        # MAP_HUGETLB); without this mount every dump silently degrades to
        # boot-disk page cache and the node's hugepage pool goes unused.
        - name: mount-hugetlbfs
          image: alpine:latest
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              apk add --no-cache util-linux >/dev/null && \
              nsenter -t 1 -m -- sh -c 'mkdir -p {{ .Values.memoryRegions.hostCtlPath }}; grep -q " {{ .Values.memoryRegions.hostCtlPath }} hugetlbfs" /proc/mounts || mount -t hugetlbfs -o pagesize={{ .Values.memoryRegions.hugetlbfs.pagesize }},mode=0777 nodev {{ .Values.memoryRegions.hostCtlPath }}; chmod 0777 {{ .Values.memoryRegions.hostCtlPath }}' && \
              echo "hugetlbfs mounted at {{ .Values.memoryRegions.hostCtlPath }}"
      {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DEPLOYMENT_MODE
              value: "k8s"
            - name: PATH
              value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: AGENT_PORT
              value: {{ .Values.port | quote }}
            {{- if .Values.featureGates }}
            {{- $gates := list }}
            {{- range $name, $enabled := .Values.featureGates }}
            {{- if not (kindIs "bool" $enabled) }}
            {{- fail (printf "featureGates.%s must be true or false, got %q" $name (toString $enabled)) }}
            {{- end }}
            {{- $gates = append $gates (printf "%s=%t" $name $enabled) }}
            {{- end }}
            - name: FEATURE_GATES
              value: {{ join "," $gates | quote }}
            {{- end }}
            {{- if .Values.nvidia.driver.enabled }}
            - name: LD_LIBRARY_PATH
              value: {{ join ":" .Values.nvidia.driver.libraryPaths }}
            {{- end }}
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
            {{- if .Values.memoryRegions.enabled }}
            - name: EXPORT_FILE_PATH
              value: {{ .Values.memoryRegions.ctlDir | quote }}
            # Snapshot slot copies must live on disk: hugetlbfs has no
            # write(2) support and copies there would pin hugepages forever.
            - name: SNAPSHOT_DIR
              value: {{ .Values.memoryRegions.snapshotDir | quote }}
            {{- if .Values.memoryRegions.copyHostFile }}
            - name: GPU_CR_COPY_HOST_FILE
              value: "1"
            {{- end }}
            - name: GPU_CR_OP_TIMEOUT_SEC
              value: {{ .Values.memoryRegions.opTimeoutSec | quote }}
            {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.port }}
              protocol: TCP
          resources:
            {{- if .Values.memoryRegions.enabled }}
            {{- /* Merge hugepages into the configured resources: hugetlb
                   cgroup charges hit the agent when it faults pages while
                   mmap-writing restores into the shared dump buffers, and
                   k8s requires a memory request alongside hugepages. */}}
            {{- $hpKey := printf "hugepages-%si" .Values.memoryRegions.hugetlbfs.pagesize }}
            {{- $req := deepCopy (default (dict) .Values.resources.requests) }}
            {{- $lim := deepCopy (default (dict) .Values.resources.limits) }}
            {{- $_ := set $req $hpKey .Values.memoryRegions.hugepagesResource }}
            {{- $_ := set $lim $hpKey .Values.memoryRegions.hugepagesResource }}
            {{- if not (hasKey $req "memory") }}{{- $_ := set $req "memory" "512Mi" }}{{- end }}
            {{- if not (hasKey $lim "memory") }}{{- $_ := set $lim "memory" "512Mi" }}{{- end }}
            {{- toYaml (dict "requests" $req "limits" $lim) | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.resources | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- if .Values.nvidia.driver.enabled }}
            - name: nvidia-driver
              mountPath: {{ .Values.nvidia.driver.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.nvidia.devices.enabled }}
            - name: nvidia-devices
              mountPath: {{ .Values.nvidia.devices.mountPath }}
            {{- end }}
            {{- if .Values.memoryRegions.enabled }}
            - name: huge-ckpt
              mountPath: {{ .Values.memoryRegions.ctlDir }}
              # Pick up the hugetlbfs mount made by the init container even
              # though the hostPath was captured before it ran.
              mountPropagation: HostToContainer
            - name: gcr-snapshots
              mountPath: {{ .Values.memoryRegions.snapshotDir }}
            {{- end }}
      volumes:
        {{- if .Values.nvidia.driver.enabled }}
        - name: nvidia-driver
          hostPath:
            path: {{ .Values.nvidia.driver.hostPath }}
            type: Directory
        {{- end }}
        {{- if .Values.nvidia.devices.enabled }}
        - name: nvidia-devices
          hostPath:
            path: {{ .Values.nvidia.devices.hostPath }}
            type: Directory
        {{- end }}
        {{- if .Values.memoryRegions.enabled }}
        - name: huge-ckpt
          hostPath:
            path: {{ .Values.memoryRegions.hostCtlPath }}
            type: DirectoryOrCreate
        - name: gcr-snapshots
          hostPath:
            path: {{ .Values.memoryRegions.snapshotsHostPath }}
            type: DirectoryOrCreate
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
