# Default values for snapshot-agent.
image:
  repository: ghcr.io/llm-d/snapshot-agent
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

# hugepages-2Mi covers hugetlb cgroup charges when the agent faults pages
# while mmap-writing restores into the shared hugetlbfs dump buffers.
resources:
  requests:
    hugepages-2Mi: "2Gi"
    memory: "512Mi"
  limits:
    hugepages-2Mi: "2Gi"
    memory: "512Mi"

nodeSelector: {}

tolerations:
  - key: "nvidia.com/gpu"
    operator: "Equal"
    value: "present"
    effect: "NoSchedule"

affinity: {}

port: 9001

securityContext:
  privileged: true

nvidia:
  driver:
    enabled: true
    hostPath: /home/kubernetes/bin/nvidia
    # Path inside the container where the driver will be mounted
    mountPath: /usr/local/nvidia
    # List of library search paths inside the container
    libraryPaths:
      - /usr/local/nvidia/lib64
  devices:
    enabled: true
    hostPath: /dev
    mountPath: /dev

rbac:
  create: true

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""