# Default values for snapshot-agent.
image:
  repository: ghcr.io/llm-d-incubation/llm-d-rl-time-slicing/snapshot-agent
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

resources: {}
#  limits:
#    cpu: 500m
#    memory: 1Gi
#  requests:
#    cpu: 100m
#    memory: 256Mi

nodeSelector: {}

tolerations:
  - key: "nvidia.com/gpu"
    operator: "Equal"
    value: "present"
    effect: "NoSchedule"
  - key: "timeslice.io/shared"
    operator: "Exists"
    effect: "NoSchedule"

affinity: {}

port: 9001

securityContext:
  privileged: true

nvidia:
  driver:
    enabled: true
    hostPath: /home/kubernetes/bin/nvidia
    # Path inside the container where the driver will be mounted
    mountPath: /usr/local/nvidia
    # List of library search paths inside the container
    libraryPaths:
      - /usr/local/nvidia/lib64
  devices:
    enabled: true
    hostPath: /dev
    mountPath: /dev

# GPU-CR memory-regions backend machinery. Default disabled: the chart is
# identical to a CUDA/app-backend deployment unless this is turned on.
memoryRegions:
  enabled: false
  # Shared checkpoint/control dir (EXPORT_FILE_PATH inside the agent).
  ctlDir: /mnt/huge-ckpt
  # Host path backing ctlDir; also the hugetlbfs mountpoint.
  hostCtlPath: /var/tmp/huge-ckpt
  hugetlbfs:
    mount: true # run the nsenter init container
    pagesize: 2M
  # hugetlb cgroup headroom for mmap-write restores into live dump buffers.
  # Rendered as hugepages-<pagesize>i requests/limits (k8s requires a memory
  # request alongside hugepages; one is added if resources doesn't set one).
  hugepagesResource: 2Gi
  # Disk-backed snapshot store: hugetlbfs has no write(2), and copies there
  # would pin hugepages forever.
  snapshotDir: /var/snapshots
  snapshotsHostPath: /var/lib/snapshot-agent/snapshots
  copyHostFile: false # GPU_CR_COPY_HOST_FILE
  opTimeoutSec: 120 # GPU_CR_OP_TIMEOUT_SEC

# Kubernetes-style feature gates (map of Name: bool), rendered into the
# agent's FEATURE_GATES env var. Experimental capabilities are off by
# default; requests selecting a gated backend fail with FAILED_PRECONDITION
# until its gate is enabled.
# Known gates:
#   DirectMemoryBackend — the experimental direct_memory backend (driven by
#   GPU-CR). Default: false.
# Example:
#   featureGates:
#     DirectMemoryBackend: true
featureGates: {}

rbac:
  create: true

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""