# Default values for snapshot-agent.
image:
  repository: ghcr.io/llm-d-incubation/llm-d-rl-time-slicing/snapshot-agent
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

resources: {}
#  limits:
#    cpu: 500m
#    memory: 1Gi
#  requests:
#    cpu: 100m
#    memory: 256Mi

nodeSelector: {}

tolerations:
  - key: "nvidia.com/gpu"
    operator: "Equal"
    value: "present"
    effect: "NoSchedule"
  - key: "timeslice.io/shared"
    operator: "Exists"
    effect: "NoSchedule"

affinity: {}

port: 9001

securityContext:
  privileged: true

nvidia:
  driver:
    enabled: true
    hostPath: /home/kubernetes/bin/nvidia
    # Path inside the container where the driver will be mounted
    mountPath: /usr/local/nvidia
    # List of library search paths inside the container
    libraryPaths:
      - /usr/local/nvidia/lib64
  devices:
    enabled: true
    hostPath: /dev
    mountPath: /dev

# Host cgroup v2 hierarchy, mounted read-write at /sys/fs/cgroup. The Suspend
# and Resume pipelines freeze, thaw and read the memory of guest pod cgroups.
# cgroup v2 is required.
cgroup:
  enabled: true
  hostPath: /sys/fs/cgroup

# GPUs and driver branches on which Suspend is allowed, as comma-separated
# "<GPU name>:<driver branch>" entries (the agent's --vram-zeroing-qualified).
# Empty keeps the agent default, "NVIDIA L4:580".
vramZeroingQualified: ""

# VRAM handling at a GPU handoff (the agent's --scrub-policy): keep (driver
# zeroing plus vramZeroingQualified), ns-scrub (the agent scrubs the freed
# VRAM after every Suspend) or flag. Empty keeps the agent default, keep.
scrubPolicy: ""

# Kubernetes-style feature gates (map of Name: bool), rendered into the
# agent's FEATURE_GATES env var. Experimental capabilities are off by
# default; requests selecting a gated backend fail with FAILED_PRECONDITION
# until its gate is enabled.
# Known gates:
#   DirectMemoryBackend — the experimental direct_memory backend (driven by
#   GPU-CR). Default: false.
# Example:
#   featureGates:
#     DirectMemoryBackend: true
featureGates: {}

rbac:
  create: true

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""