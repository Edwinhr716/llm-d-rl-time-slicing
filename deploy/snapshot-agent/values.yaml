# Default values for snapshot-agent.
image:
  repository: ghcr.io/llm-d-incubation/llm-d-rl-time-slicing/snapshot-agent
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

# NO hugepages request since GPU-CR GEP-0001 + GEP-0006: the agent moves no
# dump bytes (destination-path checkpoints run inside the workload's
# preloader) and the cr_client control channel lives on the ctl tmpfs, so
# no hugetlb page is ever faulted from this pod's cgroup. That zero request
# is also what lets this DaemonSet schedule on fresh vanilla nodes BEFORE
# hugepage capacity exists — which is why the hugepage bootstrap can run as
# an initContainer here instead of a separate DaemonSet.
# Memory = 512Mi base + the ctl tmpfs cap (worst case, tmpfs pages charge
# the first-toucher cgroup, which can be this pod via cr_client).
resources:
  requests:
    memory: "576Mi"
  limits:
    memory: "576Mi"

nodeSelector: {}

tolerations:
  - key: "nvidia.com/gpu"
    operator: "Equal"
    value: "present"
    effect: "NoSchedule"
  - key: "timeslice.io/shared"
    operator: "Exists"
    effect: "NoSchedule"

affinity: {}

port: 9001

securityContext:
  privileged: true

nvidia:
  driver:
    enabled: true
    hostPath: /home/kubernetes/bin/nvidia
    # Path inside the container where the driver will be mounted
    mountPath: /usr/local/nvidia
    # List of library search paths inside the container
    libraryPaths:
      - /usr/local/nvidia/lib64
  devices:
    enabled: true
    hostPath: /dev
    mountPath: /dev

# GPU-CR memory-regions backend machinery. Default disabled: the chart is
# identical to a CUDA/app-backend deployment unless this is turned on.
# All gpuCr.* and priorityClass.* settings below take effect only when
# memoryRegions.enabled=true.
memoryRegions:
  enabled: false
  # LEGACY pre-GEP-0001 snapshot COPY store (tmpfs). Since GEP-0001 the
  # agent copies no dump bytes — parked state lives in the destination
  # group store under gpuCr.dataDir — so this is wired ONLY as a GC input:
  # the agent TTL-reaps leftover copies from older agent versions here.
  # Set legacySnapshots.enabled=false once no pre-GEP leftovers remain.
  legacySnapshots:
    enabled: true
    snapshotDir: /var/snapshots # SNAPSHOT_DIR inside the agent
    snapshotsHostPath: /dev/shm/gcr-snapshots

gpuCr:
  # hugetlbfs data mount: dump/staging buffers and the per-group destination
  # store (groups/). Mounted at the SAME in-container path as in workload
  # pods so -o path strings resolve to the same files in both namespaces.
  dataDir:
    hostPath: /var/tmp/huge-ckpt
    mountPath: /mnt/huge-ckpt
  # GEP-0006 control-plane tmpfs: control-<pid>, pid_map, ctl-ready
  # advertisements. Host-level tmpfs so agent and workload share it.
  ctl:
    hostPath: /var/tmp/gpu-cr-ctl
    mountPath: /mnt/gpu-cr-ctl
    sizeMi: 64
  # Runtime hugepage provisioning (absorbs the former hugepages-bootstrap
  # DaemonSet): writes nr_hugepages and restarts the kubelet once per node
  # boot so the node publishes hugepages-2Mi capacity for WORKLOAD pods.
  # Validated blast radius of the restart: zero (see
  # docs/proposals/hugepages-runtime-bootstrap.md).
  bootstrap:
    enabled: true
    # 12288 x 2Mi = 24Gi, sized for two GPU-CR processes built with
    # SHM_SIZE_GB=8; use 30720 (60Gi) for two stock 25GiB builds.
    pages2Mi: 12288
  opTimeoutSec: 120 # GPU_CR_OP_TIMEOUT_SEC

priorityClass:
  # The bootstrap initContainer must win node placement over GPU workloads.
  # Created (and referenced) only when memoryRegions.enabled=true.
  create: true
  name: timeslice-snapshot-agent
  value: 900000000

# Kubernetes-style feature gates (map of Name: bool), rendered into the
# agent's FEATURE_GATES env var. Experimental capabilities are off by
# default; requests selecting a gated backend fail with FAILED_PRECONDITION
# until its gate is enabled.
# Known gates:
#   DirectMemoryBackend — the experimental direct_memory backend (driven by
#   GPU-CR). Default: false.
#   MemoryRegionsBackend — the experimental memory_regions backend (driven
#   by GPU-CR). Default: false. memoryRegions.enabled implies
#   MemoryRegionsBackend: true; an explicit entry here overrides that.
# Example:
#   featureGates:
#     DirectMemoryBackend: true
# directMemory.enabled implies DirectMemoryBackend: true; an explicit entry
# here overrides that.
featureGates: {}

# GPU-CR direct_memory (full-process) backend machinery. Default disabled:
# the chart is identical to a CUDA/app-backend deployment unless this is
# turned on. Enabling it deploys the shared checkpoint-dir mount, hostIPC,
# and implies the DirectMemoryBackend feature gate. The target workloads
# must run under the GPU-CR vGPU preloader, with shm/hugepage capacity
# sized for whole-VRAM dumps (the GPU-CR SHM_SIZE_GB build knob).
directMemory:
  enabled: false
  # Shared checkpoint/control dir (EXPORT_FILE_PATH inside the agent). The
  # agent GC only recognizes dump mappings under a path containing
  # "huge-ckpt/" — keep that segment if you change these.
  ctlDir: /mnt/huge-ckpt
  # Host path backing ctlDir; also the hugetlbfs mountpoint when
  # hugetlbfs.mount is on.
  hostCtlPath: /var/tmp/huge-ckpt
  hugetlbfs:
    # Run the privileged nsenter init container that mounts hugetlbfs at
    # hostCtlPath. Off by default: stock GPU-CR dumps into plain shm.
    mount: false
    pagesize: 2M
  # Optional hugetlb cgroup headroom for the agent itself, rendered as
  # hugepages-<pagesize>i requests/limits (plus a minimal memory request,
  # which k8s requires alongside hugepages). Empty = none: for full-process
  # checkpoints the dump is written by the workload's preloader, not the
  # agent, so the agent normally needs no hugepage allowance.
  hugepagesResource: ""
  # Per-cr_client-invocation timeout (GPU_CR_OP_TIMEOUT_SEC).
  opTimeoutSec: 120

rbac:
  create: true

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""