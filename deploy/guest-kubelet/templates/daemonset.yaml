# Template directives sit in comments and quoted strings so the file stays
# valid YAML for linters; Helm renders them all the same.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: '{{ include "guest-kubelet.fullname" . }}'
  namespace: '{{ include "guest-kubelet.namespace" . }}'
  labels:
    # {{- include "guest-kubelet.labels" . | nindent 4 }}
spec:
  updateStrategy:
    # The new pod starts next to the old one on the same node, and leader
    # election on the per-Node Lease hands the kubelet role over. A standby
    # binds no host port, so the surge pod fits next to the leader.
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      # {{- include "guest-kubelet.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        # {{- include "guest-kubelet.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: '{{ include "guest-kubelet.serviceAccountName" . }}'
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 10
      nodeSelector:
        # {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        # {{- toYaml .Values.tolerations | nindent 8 }}
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: guest-kubelet
          image: '{{ .Values.image.repository }}:{{ .Values.image.tag | default (.Values.global | default dict).imageTag | default "latest" }}'
          imagePullPolicy: '{{ .Values.image.pullPolicy }}'
          args:
            # {{- include "guest-kubelet.flags" .Values.flags | trim | nindent 12 }}
            # {{- with .Values.nodeLabels }}
            # {{- $l := list }}{{ range $k, $v := . }}{{ $l = append $l (printf "%s=%s" $k $v) }}{{ end }}
            - '--node-labels={{ join "," $l }}'
            # {{- end }}
            # {{- with .Values.nodeTaints }}
            # {{- $t := list }}{{ range . }}{{ $v := "" }}{{ with .value }}{{ $v = printf "=%s" . }}{{ end }}{{ $t = append $t (printf "%s%s:%s" .key $v .effect) }}{{ end }}
            - '--node-taints={{ join "," $t }}'
            # {{- end }}
            # {{- range .Values.extraArgs }}
            - '{{ . }}'
            # {{- end }}
          env:
            - name: HOST_IP
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          resources:
            # {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
