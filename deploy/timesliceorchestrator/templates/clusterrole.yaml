{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "timesliceorchestrator.fullname" . }}
  labels:
    {{- include "timesliceorchestrator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
{{- if eq (include "timesliceorchestrator.podsInRoles" .) "true" }}
    resources: ["nodes"]
{{- else }}
    resources: ["pods", "nodes"]
{{- end }}
    verbs: ["get", "list", "watch"]
{{- end }}
