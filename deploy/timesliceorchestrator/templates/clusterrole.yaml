{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "timesliceorchestrator.fullname" . }}
  labels:
    {{- include "timesliceorchestrator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
  # Warning events of --unconfirmed-kill (KillUnconfirmed, GrantBlocked,
  # NodeNotLendable).
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  {{- if eq .Values.unconfirmedKill.action "escalate" }}
  # Escalation step 1 deletes a guest's mirror pod, with its own grace period.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  {{- end }}
{{- end }}
