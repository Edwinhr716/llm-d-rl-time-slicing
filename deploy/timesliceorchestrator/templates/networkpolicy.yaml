{{- if and (eq (include "timesliceorchestrator.callerGuard" .) "netpol") .Values.scope.watchNamespaces }}
# scope.callerGuard=netpol: the gRPC port admits only pods in the watched
# namespaces and the peers in scope.callerGuardExtraFrom. The metrics port
# stays open to all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "timesliceorchestrator.fullname" . }}
  namespace: {{ include "timesliceorchestrator.namespace" . }}
  labels:
    {{- include "timesliceorchestrator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "timesliceorchestrator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: grpc
          protocol: TCP
      from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  {{- toYaml .Values.scope.watchNamespaces | nindent 18 }}
        {{- with .Values.scope.callerGuardExtraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    - ports:
        - port: metrics
          protocol: TCP
{{- end }}
