{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "timesliceorchestrator.fullname" . }}-configmap
  namespace: timeslice-system
  labels:
    {{- include "timesliceorchestrator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "timesliceorchestrator.fullname" . }}-configmap
subjects:
  - kind: ServiceAccount
    name: {{ include "timesliceorchestrator.serviceAccountName" . }}
    namespace: timeslice-system
{{- end }}
