apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "timesliceorchestrator.fullname" . }}
  namespace: timeslice-system
  labels:
    {{- include "timesliceorchestrator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "timesliceorchestrator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "timesliceorchestrator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "timesliceorchestrator.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--snapshot-agent-port={{ .Values.snapshotAgentPort }}"
            - "--serving-quantum={{ .Values.servingQuantum }}"
            - "--dispatch-budget-redis-addr={{ .Values.dispatchBudget.redisAddr }}"
            - "--dispatch-budget-key={{ .Values.dispatchBudget.key }}"
            - "--dispatch-budget-job={{ .Values.dispatchBudget.job }}"
            - "--dispatch-budget-open-delay={{ .Values.dispatchBudget.openDelay | default "0s" }}"
            - "--dispatch-budget-external-rising-edge={{ .Values.dispatchBudget.externalRisingEdge | default false }}"
          ports:
            - name: grpc
              containerPort: 50051
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
