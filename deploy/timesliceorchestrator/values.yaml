replicaCount: 1

# Namespace for the Deployment, Service, ServiceAccount and bindings. Keep the
# default unless you run a second, independent orchestrator install.
namespace: timeslice-system

# Recreate stops the old pod before the new one starts, so two orchestrator
# replicas never run at once and never both act on the lock ConfigMap during
# an upgrade. A RollingUpdate would briefly run two.
strategy:
  type: Recreate

# Where group lock holders are persisted. Each orchestrator install in a
# cluster needs its own ConfigMap; two installs sharing one fight over the same
# groups. namespace "" = the chart namespace above. configMap "" = the
# orchestrator's default name (timeslice-orchestrator-locks). The chart grants
# ConfigMap access in the lock namespace.
lock:
  namespace: ""
  configMap: ""

# What this orchestrator watches. Defaults watch everything, as before.
#   watchNamespaces: pods are watched only in these namespaces; pods elsewhere
#     join no group. [] = all namespaces.
#   nodeSelector: label selector (kubectl syntax, e.g. "pool=demo") limiting the
#     nodes this orchestrator sees; nodes outside it contribute to no group and
#     pods bound to them are ignored. Group membership still comes from the
#     group.timeslice.io/<group> node label. "" = all nodes. Not to be confused
#     with the pod-scheduling nodeSelector further down.
scope:
  watchNamespaces: []
  nodeSelector: ""

image:
  repository: ghcr.io/llm-d-incubation/llm-d-rl-time-slicing/timesliceorchestrator
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 50051

snapshotAgentPort: 9001

# Minimum serving quantum: the shortest time a job that has just acquired the
# group lock and had its context restored is allowed to run before
# GetGroupStatus advertises waiting jobs to it. Cooperative tenants poll that
# field and yield as soon as it is non-zero, so without a quantum a tenant can
# be pre-empted before it serves anything. "0s" disables it (default: previous
# behaviour is unchanged).
servingQuantum: "0s"

# Dispatch budget: publish an explicit "the batch tenant can serve now" signal
# to a Redis key, for a dispatcher in front of the batch tenant to gate on
# (llm-d-async's `redis` gate). "1" is written only while the batch tenant holds
# the group lock, its context is restored, and no pre-emption is being
# advertised to it; "0" is written otherwise, and is written BEFORE the tenant
# is told to yield rather than after it goes offline.
#
# redisAddr empty (default) disables publishing entirely: previous behaviour is
# unchanged. When it is set, job is REQUIRED — the orchestrator refuses to start
# without it, because publishing "0" forever would silently stall the tenant.
#
# key must match the consuming gate's budget_key. Note that the gate reads an
# ABSENT key as full capacity (fails open), so the orchestrator writes the key
# at startup and rewrites it every second rather than only on change.
#
# openDelay holds the RISING edge back. The two edges are not symmetric:
#   falling ("0")  is written inside GetGroupStatus, before the response that
#                  makes the tenant drain, so it is early for free.
#   rising  ("1")  is derived from ServingSince(), which becomes non-zero when
#                  the context is restored — measurably 0.74-1.84 s BEFORE the
#                  tenant's Service endpoint is routable again. Opening then
#                  dumps the whole accumulated backlog into a socket that is
#                  still refusing connections.
# Measured in results/redis-signal-gate: 0s cost 59/140 requests; every one of
# them failed within 1.67 s of the key going to 1. Set this to comfortably
# exceed the readiness-probe + Endpoints-propagation delay of your tenant; "2s"
# covered 59/59 on an L4 with vLLM 0.5B. The cost is openDelay of serving time
# per cycle.
#
# externalRisingEdge is the alternative to guessing at that constant: the
# orchestrator writes only "0" and never "1", and something that can actually
# observe the tenant — a node-level supervisor probing vLLM — writes the "1"
# when it is genuinely reachable. "0" is still rewritten every second, so an
# evicted key is still recreated closed. Supersedes openDelay, which is ignored
# when this is true. DANGER: with nothing publishing the "1" the gate stays shut
# forever and the batch tenant never serves; alert on
# timeslice_orchestrator_dispatch_budget_rising_edge_skipped_total rising while
# the tenant gets no traffic.
dispatchBudget:
  redisAddr: ""
  key: "dispatch-gate-budget"
  job: ""
  openDelay: "0s"
  externalRisingEdge: false

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Scheduling of the orchestrator pod itself.
nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  # Specifies whether RBAC resources should be created
  create: true
