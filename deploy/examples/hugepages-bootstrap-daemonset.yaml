# Runtime hugepage provisioning for VANILLA GPU nodepools (no
# --system-config-from-file needed). Validated end-to-end on GKE Standard;
# see docs/proposals/hugepages-runtime-bootstrap.md and
# testing-artifacts/hugepages-runtime-bootstrap-results.md.
#
# Per node, once per node boot, this DaemonSet:
#   1. allocates HUGEPAGES_2M 2Mi hugepages via /proc/sys/vm/nr_hugepages
#      (0.05 s on fresh nodes; drop_caches + compact_memory retry on
#      shortfall), and
#   2. restarts the kubelet ONCE so the node publishes hugepages-2Mi
#      capacity (kubelets only discover hugepage capacity at startup).
#      Measured blast radius of the restart: zero container restarts, no
#      Ready flap, no GKE auto-repair.
# On shortfall it exits 1 WITHOUT restarting the kubelet, so an
# undersized pool surfaces as a CrashLooping bootstrap pod instead of
# workload SIGBUS. Re-runs (pod restarts) are no-ops; node reboots
# re-provision automatically.
#
# Fill in the one placeholder (<your-gpu-pool>) before applying.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: timeslice-hugepages-bootstrap
value: 900000000
description: Hugepage-pool bootstrap; must run before GPU workloads.
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hugepages-bootstrap
  namespace: timeslice-system
  labels: {app: hugepages-bootstrap}
spec:
  selector:
    matchLabels: {app: hugepages-bootstrap}
  template:
    metadata:
      labels: {app: hugepages-bootstrap}
    spec:
      priorityClassName: timeslice-hugepages-bootstrap
      hostPID: true
      nodeSelector:
        cloud.google.com/gke-nodepool: <your-gpu-pool>
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: provision-hugepages
          image: alpine:latest
          securityContext:
            privileged: true
          env:
            # 12288 x 2Mi = 24Gi, sized for two GPU-CR processes built with
            # SHM_SIZE_GB=8 (see the user guide, step 4). Use 30720 (60Gi)
            # for two workloads on the stock 25GiB GPU-CR build. Raising
            # this later re-runs the script with one more kubelet restart.
            - name: HUGEPAGES_2M
              value: "12288"
          command:
            - sh
            - -c
            - |
              set -e
              apk add --no-cache util-linux >/dev/null
              target=$HUGEPAGES_2M
              current=$(nsenter -t 1 -m -- cat /proc/sys/vm/nr_hugepages)
              # Pool already at size => kubelet saw it at its last start:
              # either boot-time node config, or a previous run of this
              # script, which only restarts kubelet AFTER a full allocation.
              if [ "$current" -ge "$target" ]; then
                echo "hugepage pool already provisioned ($current/$target pages), nothing to do"
                exit 0
              fi
              echo "reserving $target 2Mi hugepages (currently $current)"
              nsenter -t 1 -m -- sh -c "echo $target > /proc/sys/vm/nr_hugepages"
              current=$(nsenter -t 1 -m -- cat /proc/sys/vm/nr_hugepages)
              if [ "$current" -lt "$target" ]; then
                echo "short by $((target - current)) pages; compacting and retrying"
                nsenter -t 1 -m -- sh -c 'echo 3 > /proc/sys/vm/drop_caches; echo 1 > /proc/sys/vm/compact_memory'
                nsenter -t 1 -m -- sh -c "echo $target > /proc/sys/vm/nr_hugepages"
                current=$(nsenter -t 1 -m -- cat /proc/sys/vm/nr_hugepages)
              fi
              if [ "$current" -lt "$target" ]; then
                # Fail WITHOUT restarting kubelet: an undersized pool must
                # surface here, not as workload SIGBUS later.
                echo "ERROR: only $current of $target pages allocated (memory fragmented or exhausted)"
                exit 1
              fi
              echo "pool ready; restarting kubelet so the node reports hugepages-2Mi (running pods unaffected)"
              nsenter -t 1 -m -- systemctl restart kubelet
      containers:
        - name: pause
          image: alpine:latest
          command: ["sleep", "infinity"]
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {memory: 32Mi}
