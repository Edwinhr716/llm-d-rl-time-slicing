apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: snapshot-agent
  namespace: timeslice-system
  labels:
    app.kubernetes.io/name: snapshot-agent
    app.kubernetes.io/instance: snapshot-agent
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: snapshot-agent-0.1.0
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: snapshot-agent
      app.kubernetes.io/name: snapshot-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: snapshot-agent
        app.kubernetes.io/name: snapshot-agent
    spec:
      serviceAccountName: snapshot-agent
      hostNetwork: true
      hostPID: true
      hostIPC: true
      nodeSelector:
        cloud.google.com/gke-nodepool: <your-gpu-pool>
      initContainers:
        # Mount hugetlbfs at the shared checkpoint path on the HOST. GPU-CR
        # relies on the filesystem itself being hugetlbfs (it does not pass
        # MAP_HUGETLB); without this mount every dump silently degrades to
        # boot-disk page cache and the node's hugepage pool goes unused.
        - name: mount-hugetlbfs
          image: alpine:latest
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              apk add --no-cache util-linux >/dev/null && \
              nsenter -t 1 -m -- sh -c 'mkdir -p /var/tmp/huge-ckpt; grep -q " /var/tmp/huge-ckpt hugetlbfs" /proc/mounts || mount -t hugetlbfs -o pagesize=2M,mode=0777 nodev /var/tmp/huge-ckpt; chmod 0777 /var/tmp/huge-ckpt' && \
              echo "hugetlbfs mounted at /var/tmp/huge-ckpt"
        - name: install-cuda-checkpoint
          image: alpine:latest
          command: ["sh", "-c", "apk add --no-cache wget && wget -qO /opt/bin/cuda-checkpoint https://raw.githubusercontent.com/NVIDIA/cuda-checkpoint/main/bin/x86_64_Linux/cuda-checkpoint && chmod +x /opt/bin/cuda-checkpoint && echo 'cuda-checkpoint installed'"]
          volumeMounts:
            - name: bin-dir
              mountPath: /opt/bin
      containers:
        - name: snapshot-agent
          securityContext:
            privileged: true
          image: <REGISTRY>/snapshot-agent:v0.3.0
          imagePullPolicy: IfNotPresent
          env:
            - name: PATH
              value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/bin
            - name: LD_LIBRARY_PATH
              value: /usr/local/nvidia/lib64
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: AGENT_PORT
              value: "9001"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
            # Snapshot group copies must live on disk: hugetlbfs has no
            # write(2) support and copies there would pin hugepages forever.
            - name: SNAPSHOT_DIR
              value: /var/snapshots
            - name: GPU_CR_COPY_HOST_FILE
              value: "0"
          ports:
            - name: grpc
              containerPort: 9001
              protocol: TCP
          resources:
            requests:
              hugepages-2Mi: "2Gi"
              memory: "12Gi"
            limits:
              hugepages-2Mi: "2Gi"
              memory: "12Gi"
          volumeMounts:
            - name: bin-dir
              mountPath: /opt/bin
            - name: nvidia-driver
              mountPath: /usr/local/nvidia
              readOnly: true
            - name: nvidia-devices
              mountPath: /dev
            - name: huge-ckpt
              mountPath: /mnt/huge-ckpt
              # Pick up the hugetlbfs mount made by the init container even
              # though the hostPath was prepared before it ran.
              mountPropagation: HostToContainer
            - name: gcr-snapshots
              mountPath: /var/snapshots
      volumes:
        - name: bin-dir
          emptyDir: {}
        - name: nvidia-driver
          hostPath:
            path: /home/kubernetes/bin/nvidia
            type: Directory
        - name: nvidia-devices
          hostPath:
            path: /dev
            type: Directory
        - name: huge-ckpt
          hostPath:
            path: /var/tmp/huge-ckpt
            type: DirectoryOrCreate
        - name: gcr-snapshots
          hostPath:
            path: /dev/shm/gcr-snapshots
            type: DirectoryOrCreate
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
