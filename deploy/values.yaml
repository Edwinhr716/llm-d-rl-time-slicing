# Default values for llm-d-rl-time-slicing parent chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Create the timeslice-system Namespace. Set false when the release installs
# into a namespace that already exists (for example a second, independent
# install whose subcharts set their own namespace).
createNamespace: true

# Override values for the timesliceorchestrator subchart
timesliceorchestrator:
  enabled: true
  # Guest time-slicing (shadow path): accept guest kubelets as background
  # participants, lend every idle group, read the donor controller's ns
  # labels, and push Vacate/Resume to the guest kubelets on hostCommand.port
  # (the same port as guest-kubelet.flags.host-command-port).
  hostCommand:
    port: 9002
  guest:
    backgroundRole: "true"
    lendPolicy: always
    nodeGroupLabels: either

# Override values for the snapshot-agent subchart
snapshot-agent:
  enabled: true
  image:
    tag: latest
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Equal"
      value: "present"
      effect: "NoSchedule"
    - key: "timeslice.io/shared"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    # The guest kubelet's fence on a donor host must not keep the agent off.
    - key: "timeslice.io/gpu-fence"
      operator: "Exists"
      effect: "NoSchedule"

# Override values for the node-supervisor subchart
#
# Disabled by default. HARD PRECONDITION before enabling: the orchestrator must
# run with timesliceorchestrator.dispatchBudget.externalRisingEdge: true, so
# that it writes only "0" to the dispatch budget key and the supervisor is the
# sole writer of "1". Without it the orchestrator republishes its own rising
# edge 0.74-1.84 s before the Service route exists and races this component —
# invisibly, since the supervisor still logs clusterip_probe_ok.
node-supervisor:
  enabled: false
  image:
    tag: latest
  # The supervisor is installed into the TENANT namespace, not
  # timeslice-system: that is where the pods it patches live.
  tenantNamespace: default
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "timeslice.io/shared"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

# Guest time-slicing, shadow path (the default): no DRA driver. GPU nodes keep
# GKE's stock nvidia.com/gpu device plugin; the RL donor pods ask
# nvidia.com/gpu as usual and carry timeslice.io/donor: "true"; guests carry
# timeslice.io/guest: "true" and ask nvidia.com/gpu.
#   donor-controller  labels a donor pod's node timeslice.io/donor=true and
#                     timeslice.io/group=<group> (label-keys ns);
#   gpu-shadow        on those nodes advertises timeslice.io/gpu-shadow, the
#                     GPUs the node's single nvidia.com/gpu holder holds;
#   guest-kubelet     on those nodes registers a virtual Node whose
#                     nvidia.com/gpu follows that resource (gpu-mode pooled)
#                     and runs each guest as a mirror pod asking for it;
#   timeslice-webhook wires donors (TIMESLICE_* env), steers guests, and its
#                     cluster-wide CEL policy (W11) lets only the guest kubelet
#                     ask for timeslice.io/gpu-shadow.
# Cross-references (the webhook's vk-service-account and orchestrator-addr,
# the donor controller's orchestrator-addr) default to this release's objects
# in the chart namespace; pods are watched in every namespace.
guest-kubelet:
  enabled: true
  flags:
    gpu-mode: pooled
    gpu-donor-selector: "timeslice.io/donor=true"
    # Mirrors in the guest's namespace carry an opaque group token, not the
    # donor's namespace (the orchestrator matches tokens).
    mirror-group-label: token
    guest-budget: computed
    group-source: either
    # Same port as timesliceorchestrator.hostCommand.port. host-command-allow
    # "" accepts every caller: set it to the orchestrator pod IP or CIDR.
    host-command-port: 9002
    freezer: agent
timeslice-webhook:
  enabled: true
  flags:
    donor-client-wiring: env
  # Inject the timeslice Python packages into the RL pods (donors and
  # timeslice.io/rl-integration=true pods); see the chart's values.yaml.
  rlIntegration:
    enabled: true
donor-controller:
  enabled: true
  flags:
    label-keys: ns
    # Delete a virtual Node whose host Node is gone (a recreated host).
    release-dead-hosts: "true"
    # Remove a timeslice.io/gpu-fence taint whose guest kubelet is gone.
    clear-stale-fences: "true"

# DCGM exporter on GPU hosts (SM active, SM occupancy, GPU utilization).
gpu-metrics:
  enabled: false

# The GPU shadow device plugin, on the donor hosts only.
gpu-shadow:
  enabled: true
  nodeSelector:
    timeslice.io/donor: "true"

# Override values for the nvidia-dra-driver-gpu subchart. Off: the shadow path
# needs no DRA driver. Turn it on only for the DRA claim path
# (guest-kubelet.flags.gpu-mode: claim).
nvidia-dra-driver-gpu:
  enabled: false
  namespaceOverride: "timeslice-system"
  nvidiaDriverRoot: "/home/kubernetes/bin/nvidia/" # Use "/opt/nvidia" for Ubuntu nodes

  gpuResourcesEnabledOverride: true
  resources:
    computeDomains:
      enabled: false
  kubeletPlugin:
    priorityClassName: ""
    tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "timeslice.io/shared"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: "cloud.google.com/gke-gpu"
              operator: "In"
              values:
              - "true"


