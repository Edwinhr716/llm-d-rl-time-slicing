# Builds the snapshot-agent and LoRA-swap workload images.
# Usage:
#   gcloud builds submit . --config=cloudbuild-snapshot-agent.yaml \
#     --substitutions=_TAG=taska-<shortsha>
steps:
  - id: build-snapshot-agent
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - docker/snapshot-agent/Dockerfile
      - -t
      - asia-southeast1-docker.pkg.dev/$PROJECT_ID/time-slicing/llm-d-rl-time-slicing/snapshot-agent:${_TAG}
      - .
  - id: build-lora-swap-workload
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - testing-artifacts/Dockerfile.lora-max1
      - -t
      - asia-southeast1-docker.pkg.dev/$PROJECT_ID/time-slicing/llm-d-rl-time-slicing/lora-swap-client-max1:${_TAG}
      - .
images:
  - asia-southeast1-docker.pkg.dev/$PROJECT_ID/time-slicing/llm-d-rl-time-slicing/snapshot-agent:${_TAG}
  - asia-southeast1-docker.pkg.dev/$PROJECT_ID/time-slicing/llm-d-rl-time-slicing/lora-swap-client-max1:${_TAG}
substitutions:
  _TAG: dev
options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 2400s
