steps:
- name: gcr.io/cloud-builders/docker
  args:
  - build
  - -f
  - docker/snapshot-agent/Dockerfile
  - --build-arg
  - GPUCR_IMAGE=$_GPUCR_IMAGE
  - -t
  - asia-southeast1-docker.pkg.dev/$PROJECT_ID/time-slicing/llm-d-rl-time-slicing/snapshot-agent:$_TAG
  - .
images:
- asia-southeast1-docker.pkg.dev/$PROJECT_ID/time-slicing/llm-d-rl-time-slicing/snapshot-agent:$_TAG
substitutions:
  _TAG: ctl-tmpfs-v1
  _GPUCR_IMAGE: asia-southeast1-docker.pkg.dev/edwinhernandez-gke-dev/time-slicing/gpucr-so:gep0006-6bdce96
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
