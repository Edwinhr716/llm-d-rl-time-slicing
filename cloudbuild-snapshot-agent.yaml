steps:
- name: gcr.io/cloud-builders/docker
  args:
  - build
  - -f
  - docker/snapshot-agent/Dockerfile
  - -t
  - asia-southeast1-docker.pkg.dev/$PROJECT_ID/time-slicing/llm-d-rl-time-slicing/snapshot-agent:hugetlbfs-v5
  - .
images:
- asia-southeast1-docker.pkg.dev/$PROJECT_ID/time-slicing/llm-d-rl-time-slicing/snapshot-agent:hugetlbfs-v5
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
