apiVersion: apps/v1
kind: Deployment
metadata:
  name: validator-deployment
  labels:
    app: validator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: validator
  template:
    metadata:
      labels:
        app: validator
        snapshot-agent: "true"
        timeslice.io/job-id: "test-job"
    spec:
      hostIPC: true
      hostPID: true
      containers:
      - name: validator
        image: asia-southeast1-docker.pkg.dev/edwinhernandez-gke-dev/snapshot-example/snapshot-client:test-fix-11 # Replace with your actual image tag
        command: ["python3"]
        args: ["validate_selective_cr.py"]
        imagePullPolicy: Always
        env:
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: AGENT_ENDPOINT
          value: "$(NODE_IP):9001"
        - name: JOB_ID
          value: "test-job"
        - name: GROUP
          value: "test-group"
        - name: GPU_VENDOR
          value: "NVIDIA"
        - name: LD_PRELOAD
          value: "/usr/local/lib/vGPU-NVIDIA.so"
        - name: LD_LIBRARY_PATH
          value: "/usr/local/cuda/lib64"
        - name: PYTORCH_NO_CUDA_MEMORY_CACHING
          value: "1"
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        - name: CUDA_LAUNCH_BLOCKING
          value: "1"
        volumeMounts:
        - name: huge-ckpt
          mountPath: /mnt/huge-ckpt
        resources:
          claims:
            - name: gpus-for-pod
      volumes:
      - name: huge-ckpt
        hostPath:
          path: /var/tmp/huge-ckpt
          type: DirectoryOrCreate
      resourceClaims:
      - name: gpus-for-pod # This is the internal name used by the container
        resourceClaimName: shared-two-gpus-claim # References the standalone claim
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
