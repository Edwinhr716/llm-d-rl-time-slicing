# Appendix A - host-exec helper pods, one per track node on hpboot-l4-c.
# Node names are from the taskc test run (pool hpboot-l4-c, 2026-08-10).
apiVersion: v1
kind: Pod
metadata:
  name: hostexec-a
  namespace: taskc-hpboot
spec:
  nodeName: gke-dra-testing-hpboot-l4-c-4b3a7927-l9fv
  hostPID: true
  containers:
    - name: shell
      image: alpine:latest
      command: ["sh", "-c", "apk add --no-cache util-linux >/dev/null && sleep infinity"]
      securityContext:
        privileged: true
  restartPolicy: Never
---
