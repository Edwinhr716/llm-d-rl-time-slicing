# T7: snapshot-agent DaemonSet for the bootstrap-provisioned vanilla pool
# hpboot-l4-c (track b node). Copy of deploy/examples/
# snapshot-agent-memory-addresses.yaml with the two placeholders filled in
# (taskc agent image, hpboot-l4-c pool selector) and a taskc-suffixed name so
# it can coexist with the other snapshot-agent DaemonSets in timeslice-system.
# Reuses the existing snapshot-agent ServiceAccount/RBAC in timeslice-system.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: snapshot-agent-taskc
  namespace: timeslice-system
  labels:
    app.kubernetes.io/name: snapshot-agent
    app.kubernetes.io/instance: snapshot-agent-taskc
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: snapshot-agent-taskc
      app.kubernetes.io/name: snapshot-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: snapshot-agent-taskc
        app.kubernetes.io/name: snapshot-agent
    spec:
      serviceAccountName: snapshot-agent
      hostNetwork: true
      hostPID: true
      hostIPC: true
      nodeSelector:
        cloud.google.com/gke-nodepool: hpboot-l4-c
        hp-test/track: b
      initContainers:
        # Mount hugetlbfs at the shared checkpoint path on the HOST. GPU-CR
        # relies on the filesystem itself being hugetlbfs; without this mount
        # every dump silently degrades to boot-disk page cache.
        - name: mount-hugetlbfs
          image: alpine:latest
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - |
              apk add --no-cache util-linux >/dev/null && \
              nsenter -t 1 -m -- sh -c 'mkdir -p /var/tmp/huge-ckpt; grep -q " /var/tmp/huge-ckpt hugetlbfs" /proc/mounts || mount -t hugetlbfs -o pagesize=2M,mode=0777 nodev /var/tmp/huge-ckpt; chmod 0777 /var/tmp/huge-ckpt' && \
              echo "hugetlbfs mounted at /var/tmp/huge-ckpt"
        - name: install-cuda-checkpoint
          image: alpine:latest
          command: ["sh", "-c", "apk add --no-cache wget && wget -qO /opt/bin/cuda-checkpoint https://raw.githubusercontent.com/NVIDIA/cuda-checkpoint/main/bin/x86_64_Linux/cuda-checkpoint && chmod +x /opt/bin/cuda-checkpoint && echo 'cuda-checkpoint installed'"]
          volumeMounts:
            - name: bin-dir
              mountPath: /opt/bin
      containers:
        - name: snapshot-agent
          securityContext:
            privileged: true
          image: asia-southeast1-docker.pkg.dev/edwinhernandez-gke-dev/time-slicing/llm-d-rl-time-slicing/snapshot-agent:taskc-1a0245b
          imagePullPolicy: IfNotPresent
          env:
            - name: PATH
              value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/bin
            - name: LD_LIBRARY_PATH
              value: /usr/local/nvidia/lib64
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: AGENT_PORT
              value: "9001"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
            - name: SNAPSHOT_DIR
              value: /var/snapshots
            - name: GPU_CR_COPY_HOST_FILE
              value: "0"
          ports:
            - name: grpc
              containerPort: 9001
              protocol: TCP
          resources:
            requests:
              hugepages-2Mi: "2Gi"
              memory: "12Gi"
            limits:
              hugepages-2Mi: "2Gi"
              memory: "12Gi"
          volumeMounts:
            - name: bin-dir
              mountPath: /opt/bin
            - name: nvidia-driver
              mountPath: /usr/local/nvidia
              readOnly: true
            - name: nvidia-devices
              mountPath: /dev
            - name: huge-ckpt
              mountPath: /mnt/huge-ckpt
              mountPropagation: HostToContainer
            - name: gcr-snapshots
              mountPath: /var/snapshots
      volumes:
        - name: bin-dir
          emptyDir: {}
        - name: nvidia-driver
          hostPath:
            path: /home/kubernetes/bin/nvidia
            type: Directory
        - name: nvidia-devices
          hostPath:
            path: /dev
            type: Directory
        - name: huge-ckpt
          hostPath:
            path: /var/tmp/huge-ckpt
            type: DirectoryOrCreate
        - name: gcr-snapshots
          hostPath:
            path: /dev/shm/gcr-snapshots
            type: DirectoryOrCreate
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
