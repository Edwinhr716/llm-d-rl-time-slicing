# T7: single-shot LoRA slot-swap validation job (copy of
# testing-artifacts/job-lora-swap-max1.yaml) pinned to the bootstrap-
# provisioned vanilla node (pool hpboot-l4-c, track b) in taskc-hpboot.
apiVersion: batch/v1
kind: Job
metadata:
  name: lora-swap-max1-job
  namespace: taskc-hpboot
  labels:
    app: lora-swap-max1
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: lora-swap-max1
        snapshot-agent: "true"
        timeslice.io/job-id: "lora-test-max1"
    spec:
      restartPolicy: Never
      hostIPC: true
      hostPID: true  # Required for GPU-CR IPC matching
      nodeSelector:
        cloud.google.com/gke-nodepool: hpboot-l4-c
        hp-test/track: b
      containers:
      - name: lora-swap
        image: asia-southeast1-docker.pkg.dev/edwinhernandez-gke-dev/snapshot-example/lora-swap-client-max1:latest
        command: ["python3"]
        args: ["test_lora_swap_max1.py"]
        securityContext:
          runAsUser: 0
        imagePullPolicy: Always
        env:
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: AGENT_ENDPOINT
          value: "$(NODE_IP):9001"
        - name: JOB_ID
          value: "lora-test-max1"
        - name: GROUP
          value: "lora-group"
        - name: GPU_VENDOR
          value: "NVIDIA"
        - name: VLLM_ALLOW_INSECURE_SERIALIZATION
          value: "1"
        - name: LD_PRELOAD
          value: "/usr/local/lib/vGPU-NVIDIA.so"
        - name: VLLM_ENABLE_V1_MULTIPROCESSING
          value: "0"
        - name: LD_LIBRARY_PATH
          # /usr/local/nvidia/lib64 is where GKE's device plugin injects the
          # driver (libcuda.so.1); must precede the CUDA toolkit path.
          value: "/usr/local/nvidia/lib64:/usr/local/cuda/lib64"
        - name: PYTORCH_NO_CUDA_MEMORY_CACHING
          value: "1"
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        - name: CUDA_LAUNCH_BLOCKING
          value: "1"
        volumeMounts:
        - name: huge-ckpt
          mountPath: /mnt/huge-ckpt
          mountPropagation: HostToContainer
        resources:
          requests:
            memory: "4Gi"
            nvidia.com/gpu: "1"
            # 25Gi dump buffer + 2x1Gi staging per CUDA process (compile-time
            # in vGPU-NVIDIA.so), reserved at mmap time + 1Gi headroom.
            hugepages-2Mi: "28Gi"
          limits:
            memory: "4Gi"
            nvidia.com/gpu: "1"
            hugepages-2Mi: "28Gi"
      volumes:
      - name: huge-ckpt
        hostPath:
          path: /var/tmp/huge-ckpt
          type: DirectoryOrCreate
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
